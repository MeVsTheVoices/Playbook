name: Portal styles

on:
  pull_request:
    paths:
      - "callback_site/styles/**"
      - "callback_site/static/*.css"
      - "callback_site/build_styles.py"
      - "callback_site/requirements-styles.txt"
      - "callback_site/tests/test_style_build.py"
      - "callback_site/frontend/**"
      - "callback_site/build_frontend.mjs"
      - "callback_site/package*.json"
      - "callback_site/static/structured_output*"
      - ".github/workflows/styles.yml"
  push:
    paths:
      - "callback_site/styles/**"
      - "callback_site/static/*.css"
      - "callback_site/build_styles.py"
      - "callback_site/requirements-styles.txt"
      - "callback_site/tests/test_style_build.py"
      - "callback_site/frontend/**"
      - "callback_site/build_frontend.mjs"
      - "callback_site/package*.json"
      - "callback_site/static/structured_output*"
      - ".github/workflows/styles.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  styles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: callback_site/requirements-styles.txt
      - run: python -m pip install -r callback_site/requirements-styles.txt
      - run: python callback_site/build_styles.py --check
      - run: python -m unittest callback_site.tests.test_style_build
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: callback_site/package-lock.json
      - run: npm ci
        working-directory: callback_site
      - run: npm run check
        working-directory: callback_site
