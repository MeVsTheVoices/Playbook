title = "Playbook secret detection"

[extend]
useDefault = true

[[allowlists]]
description = "Public signing-key fingerprint in historical retired Tower-2 Compose files, not a private credential"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)tower-2-compose/(?:discord_bot|dockerbot)/docker-compose\.yml$''']
regexes = ['''^A035C8C19219BA821ECEA86B64E628F8D684696D$''']

[[rules]]
id = "tailscale-key"
description = "Tailscale authentication or API key (including legacy keys)"
regex = '''\btskey-(?:auth-|api-)?[A-Za-z0-9_-]{20,}\b'''
keywords = ["tskey-"]

[[rules.allowlists]]
description = "Verified synthetic cloud-init test fixture, not a usable Tailscale key"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)callback_site/tests/test_sd_cloud_init_render\.py$''']
regexes = ['''^tskey-auth-kTEST123CNTRL-abcdef$''']

[[rules]]
id = "discord-bot-token"
description = "Discord bot token"
regex = '''\b[A-Za-z0-9_-]{23,28}\.[A-Za-z0-9_-]{6}\.[A-Za-z0-9_-]{27,110}\b'''

[[rules]]
id = "literal-credential-assignment"
description = "Credential fields in configuration files must use secret references, not literals"
path = '''(?:^|/)(?:[^/]+\.(?:ya?ml|json|toml|ini|cfg|conf|properties|env|bash|sh)|\.env(?:\.[^/]*)?)$'''
regex = '''(?im)^[ \t]*(?:#[ \t]*)?(?:export[ \t]+)?(?:-[ \t]*)?(?:[,{][ \t]*)?["']?[A-Za-z0-9_.-]*(?:TOKEN|PASSWORD(?:[_-]HASH)?|PASSWD(?:[_-]HASH)?|SECRET|API[_-]?KEY|ACCESS[_-]?(?:KEY|TOKEN)|AUTH(?:ORIZATION|[_-]?(?:KEY|TOKEN))?|PRIVATE[_-]?KEY|TLS[_-]?KEY|CREDENTIALS?|VAULT[_-]?(?:PASS(?:WORD)?|KEY)|ENCRYPTION[_-]?KEY|SIGNING[_-]?KEY)[ \t]*["']?[ \t]*(?:=|:[ \t]*)["']?([^\s,#"'{}$|>][^\s,#"'{}]*)'''
secretGroup = 1

[[rules.allowlists]]
description = "Explicit historical redaction marker"
regexTarget = "secret"
regexes = ['''^REDACTED$''']

[[rules.allowlists]]
description = "Obvious example placeholders and non-secret boolean values"
regexTarget = "secret"
regexes = ['''(?i)^(?:CHANGE[_-]?ME|REPLACE[_-]?ME|YOUR[_-].*|EXAMPLE|DUMMY|TRUE|FALSE|YES|NO|ON|OFF|NULL|NONE|TOKEN|BASIC|BEARER|DIGEST|REQUIRED|OPTIONAL|DISABLED)$''']

[[rules.allowlists]]
description = "Ansible variable references in K3s config maps, not literal tokens"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)roles/raspberry_pi(?:_3bplus|4|5)/tasks/main\.yml$''']
regexes = ['''^raspberry_pi(?:_3bplus|4|5)_[A-Za-z0-9_]+$''']

[[rules.allowlists]]
description = "Escaped shell-variable expansion prefix captured from generated Influx configuration"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)scripts/(?:lib/user_data_scripts|prepare_sd_cloud_init)\.sh$''']
regexes = ['''^\\\$$''']

[[rules.allowlists]]
description = "Verified change-me placeholder in the historical Pi 5 Vault example"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)group_vars/rpi5/vault\.example\.yml$''']
regexes = ['''^tskey-secret-CHANGE_ME$''']

[[rules.allowlists]]
description = "Verified substitution placeholder in the historical router example"
condition = "AND"
regexTarget = "secret"
paths = ['''(?:^|/)personal/gateways/configure_gl_inet_wireless_bridge\.yaml$''']
regexes = ['''^tskey-auth-yourkeyhere$''']
