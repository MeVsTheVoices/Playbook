<div class="grid-span-full" data-wifi-widget>
  <input type="hidden" data-option-key="wifi_networks">
  <p class="segment-hint">Additional WPA/WPA2 networks. The device chooses among available networks. Saved credentials are masked; replacing them requires entering all additional networks again.</p>
  <div data-wifi-rows></div>
  <p class="hint" data-wifi-saved hidden>Additional networks are saved for this browser session.</p>
  <button type="button" class="secondary" data-wifi-add>Add Wi-Fi network</button>
  <button type="button" class="secondary" data-wifi-replace hidden>Replace saved networks</button>
  <button type="button" class="secondary" data-wifi-clear hidden>Remove saved networks</button>
</div>
