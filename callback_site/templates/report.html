<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Node Report {{ report_id }}</title>
    <style>
      :root {
        --bg: #f3f5f7;
        --card: #ffffff;
        --ink: #1d2939;
        --muted: #52606d;
        --line: #d0d7de;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 1080px;
        margin: 1.4rem auto;
        padding: 0 1rem;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 1rem;
      }
      .meta {
        color: var(--muted);
        font-size: 0.9rem;
      }
      pre {
        margin: 0;
        max-height: 72vh;
        overflow: auto;
        background: #0b1020;
        color: #d6deeb;
        border-radius: 10px;
        padding: 0.9rem;
        font-family: "IBM Plex Mono", monospace;
        font-size: 0.82rem;
        line-height: 1.4;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>Node Report</h1>
        <div class="meta">
          report id: <code>{{ report_id }}</code>
          {% if report.hostname %} | host: <strong>{{ report.hostname }}</strong>{% endif %}
          {% if report.received_at %} | received: {{ report.received_at }}{% endif %}
        </div>
        <p><a href="/">Back to Callback Dashboard</a></p>
      </div>
      <div class="panel">
        <pre>{{ report | tojson(indent=2) }}</pre>
      </div>
    </div>
  </body>
</html>
