<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tailscale ACL Planner</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
      :root {
        --bg: #f3f5f7;
        --card: #ffffff;
        --ink: #1d2939;
        --muted: #52606d;
        --accent: #0f766e;
        --line: #d0d7de;
      }
      body {
        margin: 0;
        font-family: "IBM Plex Sans", "Segoe UI", sans-serif;
        background: radial-gradient(circle at 12% 12%, #e6fffa 0, transparent 35%), var(--bg);
        color: var(--ink);
      }
      .sidebar {
        position: fixed;
        top: 0;
        left: 0;
        bottom: 0;
        width: 220px;
        background: #0f172a;
        color: #cbd5e1;
        transition: width 0.2s ease;
        overflow: hidden;
        padding: 0.8rem;
        box-sizing: border-box;
      }
      .sidebar-brand {
        padding: 0.25rem 0.45rem 0.8rem;
        margin-bottom: 0.7rem;
        border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      }
      .sidebar-title {
        font-size: 0.95rem;
        font-weight: 800;
        color: #f8fafc;
        letter-spacing: 0.02em;
      }
      .sidebar-subtitle {
        margin-top: 0.2rem;
        color: #94a3b8;
        font-size: 0.75rem;
      }
      .sidebar a {
        display: block;
        color: #cbd5e1;
        text-decoration: none;
        padding: 0.55rem;
        border-radius: 8px;
        margin-bottom: 0.25rem;
      }
      .sidebar a:hover { background: rgba(148, 163, 184, 0.16); }
      .sidebar a.active {
        background: rgba(20, 184, 166, 0.18);
        color: #ecfeff;
        border: 1px solid rgba(45, 212, 191, 0.2);
      }
      .toggle-btn {
        width: 100%;
        margin-bottom: 0.8rem;
        border: 1px solid #334155;
        background: #111827;
        color: #cbd5e1;
        border-radius: 8px;
        padding: 0.5rem;
        cursor: pointer;
      }
      body.sidebar-collapsed .sidebar { width: 72px; }
      body.sidebar-collapsed .sidebar .label { display: none; }
      .content {
        margin-left: 236px;
        transition: margin-left 0.2s ease;
      }
      body.sidebar-collapsed .content { margin-left: 88px; }
      .wrap {
        max-width: 1150px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      .panel {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 1rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        margin-bottom: 1rem;
      }
      .lazy {
        min-height: 80px;
      }
      .skeleton {
        color: var(--muted);
        font-size: 0.9rem;
      }
      .top-nav a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 0.8rem;
      }
      label {
        display: block;
        font-size: 0.82rem;
        color: var(--muted);
        margin-bottom: 0.2rem;
      }
      input, textarea, button {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 0.6rem;
        font-family: inherit;
        font-size: 0.92rem;
        box-sizing: border-box;
      }
      textarea { min-height: 84px; }
      button {
        background: var(--accent);
        color: white;
        border: none;
        cursor: pointer;
      }
      pre {
        background: #0b1020;
        color: #d6deeb;
        border-radius: 10px;
        padding: 0.8rem;
        overflow: auto;
        font-size: 0.82rem;
      }
      .warn {
        color: #7f1d1d;
        background: #fee2e2;
        border: 1px solid #fecaca;
        border-radius: 10px;
        padding: 0.6rem;
      }
    </style>
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-title">Callback Site</div>
        <div class="sidebar-subtitle">Cloud-init, imaging, and node ops</div>
      </div>
      <button class="toggle-btn" id="sidebar-toggle">Toggle</button>
      <a class="{% if request.path == '/' %}active{% endif %}" href="/"><span>Home</span> <span class="label">Dashboard</span></a>
      <a class="{% if request.path.startswith('/nodes') %}active{% endif %}" href="/nodes"><span>Nodes</span> <span class="label">Node Ops</span></a>
      <a class="{% if request.path.startswith('/tailscale-acl') %}active{% endif %}" href="/tailscale-acl"><span>ACL</span> <span class="label">Tailscale ACL</span></a>
    </aside>

    <main class="content">
      <div class="wrap">
        <div class="panel top-nav">
          <a href="/">Back To Callback Dashboard</a>
        </div>

        <section
          id="acl-overview-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/overview"
          hx-trigger="load delay:80ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading overview...</p>
        </section>

        <section
          id="acl-inputs-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/inputs"
          hx-trigger="load delay:220ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading input controls...</p>
        </section>

        <section
          id="acl-output-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/output"
          hx-trigger="load delay:420ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading policy output panel...</p>
        </section>

        <section
          id="acl-apply-guide-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/apply-guide"
          hx-trigger="load delay:620ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading apply guide...</p>
        </section>
      </div>
    </main>

    <script>
      const body = document.body;
      const toggleBtn = document.getElementById("sidebar-toggle");

      function initSidebar() {
        const saved = localStorage.getItem("sidebar-collapsed");
        if (saved === "1") {
          body.classList.add("sidebar-collapsed");
        }
      }

      toggleBtn.addEventListener("click", () => {
        body.classList.toggle("sidebar-collapsed");
        localStorage.setItem("sidebar-collapsed", body.classList.contains("sidebar-collapsed") ? "1" : "0");
      });

      function parseSubnets(text) {
        return text
          .split("\n")
          .map((s) => s.trim())
          .filter(Boolean);
      }

      function generatePolicy() {
        const out = document.getElementById("policy_output");
        const adminEl = document.getElementById("admin_group");
        const rpi5El = document.getElementById("rpi5_tag");
        const bplusEl = document.getElementById("rpi_bplus_tag");
        const homelabEl = document.getElementById("homelab_tag");
        const subnetEl = document.getElementById("pi5_subnets");

        if (!out || !adminEl || !rpi5El || !bplusEl || !homelabEl || !subnetEl) {
          return;
        }

        const admin = adminEl.value.trim();
        const rpi5Tag = rpi5El.value.trim();
        const bplusTag = bplusEl.value.trim();
        const homelabTag = homelabEl.value.trim();
        const subnets = parseSubnets(subnetEl.value);

        const policy = {
          tagOwners: {
            [rpi5Tag]: [admin],
            [bplusTag]: [admin],
            [homelabTag]: [admin],
          },
          autoApprovers: {
            routes: {},
          },
          acls: [
            {
              action: "accept",
              src: [admin],
              dst: [`${rpi5Tag}:*`, `${bplusTag}:*`, `${homelabTag}:*`],
            },
            {
              action: "accept",
              src: [rpi5Tag, bplusTag],
              dst: [`${homelabTag}:*`],
            },
          ],
          ssh: [
            {
              action: "accept",
              src: [admin],
              dst: [rpi5Tag, bplusTag],
              users: ["autogroup:nonroot", "root"],
            },
          ],
        };

        subnets.forEach((cidr) => {
          policy.autoApprovers.routes[cidr] = [rpi5Tag, homelabTag];
        });

        out.textContent = JSON.stringify(policy, null, 2);
      }

      function bindAclInputEvents() {
        const generateBtn = document.getElementById("generate");
        const inputsSection = document.getElementById("acl-inputs-section");

        if (generateBtn && !generateBtn.dataset.bound) {
          generateBtn.addEventListener("click", generatePolicy);
          generateBtn.dataset.bound = "1";
        }

        if (inputsSection && !inputsSection.dataset.bound) {
          inputsSection.addEventListener("input", (event) => {
            const target = event.target;
            if (target && (target.tagName === "INPUT" || target.tagName === "TEXTAREA")) {
              generatePolicy();
            }
          });
          inputsSection.dataset.bound = "1";
        }

        generatePolicy();
      }

      document.body.addEventListener("htmx:afterSwap", (event) => {
        const targetId = event.target && event.target.id ? event.target.id : "";
        if (targetId === "acl-inputs-section" || targetId === "acl-output-section") {
          bindAclInputEvents();
        }
      });

      initSidebar();
    </script>
  </body>
</html>
