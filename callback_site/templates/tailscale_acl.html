<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tailscale ACL Planner</title>
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='tailscale_acl.css') }}">
  </head>
  <body>
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sidebar-title">Callback Site</div>
        <div class="sidebar-subtitle">Cloud-init, imaging, and node ops</div>
      </div>
      <button class="toggle-btn" id="sidebar-toggle">Toggle</button>
      <a class="{% if request.path == '/' %}active{% endif %}" href="/"><span class="label">Dashboard</span></a>
      <a class="{% if request.path.startswith('/nodes') %}active{% endif %}" href="/nodes"><span class="label">Node Ops</span></a>
      <a class="{% if request.path.startswith('/monitor') %}active{% endif %}" href="/monitor"><span class="label">Monitor</span></a>
      <a class="{% if request.path.startswith('/images') %}active{% endif %}" href="/images"><span class="label">Image Library</span></a>
      <a class="{% if request.path.startswith('/tailscale-acl') %}active{% endif %}" href="/tailscale-acl"><span class="label">Tailscale ACL</span></a>
      <a class="{% if request.path.startswith('/test-terminal') %}active{% endif %}" href="/test-terminal"><span class="label">Verifier</span></a>
      <a class="{% if request.path.startswith('/settings') %}active{% endif %}" href="/settings"><span class="label">Settings</span></a>
    </aside>

    <main class="content">
      <div class="wrap">
        <div class="panel top-nav">
          <a href="/">Back To Callback Dashboard</a>
        </div>

        <section
          id="acl-overview-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/overview"
          hx-trigger="load delay:80ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading overview...</p>
        </section>

        <section
          id="acl-inputs-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/inputs"
          hx-trigger="load delay:220ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading input controls...</p>
        </section>

        <section
          id="acl-output-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/output"
          hx-trigger="load delay:420ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading policy output panel...</p>
        </section>

        <section
          id="acl-apply-guide-section"
          class="panel lazy"
          hx-get="/fragments/tailscale-acl/apply-guide"
          hx-trigger="load delay:620ms"
          hx-swap="innerHTML"
        >
          <p class="skeleton">Loading apply guide...</p>
        </section>
      </div>
    </main>

    <script src="{{ url_for('static', filename='tailscale_acl.js') }}" defer></script>
  </body>
</html>
