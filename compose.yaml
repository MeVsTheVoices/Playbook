name: playbook

services:
  callback-site:
    image: playbook-callback-site
    build:
      context: .
      dockerfile: callback_site/Dockerfile
    ports:
      # Nodes call back here from the LAN; this listener answers only node endpoints.
      - "${CALLBACK_PORT:-8088}:8088"
      # Dashboard: this machine only. Set CALLBACK_ADMIN_BIND=0.0.0.0 in .env to open it to the LAN.
      - "${CALLBACK_ADMIN_BIND:-127.0.0.1}:${CALLBACK_ADMIN_PORT:-8091}:8089"
    environment:
      CALLBACK_APPDATA_DIR: /data
      CALLBACK_PUBLIC_URL: ${CALLBACK_PUBLIC_URL:-}
      CALLBACK_PUBLIC_HOST: ${CALLBACK_PUBLIC_HOST:-}
      CALLBACK_PUBLIC_PORT: ${CALLBACK_PUBLIC_PORT:-${CALLBACK_PORT:-8088}}
      CALLBACK_ADMIN_PORT: "${CALLBACK_ADMIN_PORT:-8091}"
      CALLBACK_ADMIN_HOSTS: "${CALLBACK_ADMIN_HOSTS:-}"
      # Host SD/USB flasher (scripts/run_sd_flasher.sh); set to "" to disable.
      SD_FLASHER_URL: ${SD_FLASHER_URL-http://host.docker.internal:8089}
    env_file:
      - path: .local/sd-flasher.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - callback-site-data:/data
    restart: unless-stopped

volumes:
  callback-site-data:
    name: playbook_callback-site-data
