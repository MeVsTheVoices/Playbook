name: playbook

services:
  callback-site:
    image: playbook-callback-site
    build:
      context: .
      dockerfile: callback_site/Dockerfile
    ports:
      - "${CALLBACK_PORT:-8088}:8088"
    environment:
      CALLBACK_APPDATA_DIR: /data
      # Host SD/USB flasher (scripts/run_sd_flasher.sh); set to "" to disable.
      SD_FLASHER_URL: ${SD_FLASHER_URL-http://host.docker.internal:8089}
    env_file:
      - path: .local/sd-flasher.env
        required: false
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - callback-site-data:/data
    restart: unless-stopped

volumes:
  callback-site-data:
    name: playbook_callback-site-data
