name: playbook

services:
  callback-site:
    image: playbook-callback-site
    build:
      context: .
      dockerfile: callback_site/Dockerfile
    ports:
      # Nodes call back here from the LAN; this listener answers only node endpoints.
      - "${CALLBACK_PORT:-8088}:8088"
      # Dashboard: this machine only. Set CALLBACK_ADMIN_BIND=0.0.0.0 in .env to open it to the LAN.
      - "${CALLBACK_ADMIN_BIND:-127.0.0.1}:${CALLBACK_ADMIN_PORT:-8089}:8089"
    environment:
      CALLBACK_APPDATA_DIR: /data
      CALLBACK_ADMIN_PORT: "${CALLBACK_ADMIN_PORT:-8089}"
      CALLBACK_ADMIN_HOSTS: "${CALLBACK_ADMIN_HOSTS:-}"
    volumes:
      - callback-site-data:/data
    restart: unless-stopped

volumes:
  callback-site-data:
    name: playbook_callback-site-data
