apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: servarr
helmCharts:
  - name: servarr
    repo: https://charts.kubito.dev
    version: 1.5.2
    releaseName: servarr
    namespace: servarr
    valuesFile: values.yaml
patches:
  - path: qbittorrent-sidecar.yaml
    target:
      kind: Deployment
      name: servarr-qbittorrent
  - path: qbittorrent-vpn.patch.yaml
    target:
      kind: Deployment
      name: servarr-qbittorrent
  - target:
      kind: "(ServiceAccount|Service|Deployment|Ingress)"
    patch: |-
      - op: add
        path: /metadata/namespace
        value: servarr
