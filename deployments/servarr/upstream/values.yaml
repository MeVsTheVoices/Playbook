bazarr:
  env:
    TZ: America/Los_Angeles
  persistence:
    existingClaim: servarr-bazarr

seerr:
  persistence:
    existingClaim: servarr-seerr
  podSecurityContext:
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    runAsGroup: 1000
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  ingress:
    enabled: true
    className: tailscale
    hosts:
      - host: seerr
        paths: [{path: /, pathType: Prefix}]
    tls:
      - hosts: [seerr]
        secretName: seerr-tls

lidarr:
  enabled: false
cleanuparr:
  enabled: false
