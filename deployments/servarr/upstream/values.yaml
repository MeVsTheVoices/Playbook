jellyfin:
  persistence:
    config:
      existingClaim: servarr-jellyfin-config
    media:
      existingClaim: servarr-jellyfin-media
  extraEnvVars:
    - name: TZ
      value: America/Los_Angeles
  tailscale:
    enabled: true
    sidecar:
      enabled: false
    ingress:
      enabled: true
      host: jellyfin

sonarr:
  env:
    TZ: America/Los_Angeles
  persistence:
    existingClaim: servarr-sonarr
  ingress:
    enabled: true
    className: tailscale
    hosts:
      - host: sonarr
        paths: [{path: /, pathType: Prefix}]
    tls:
      - hosts: [sonarr]
        secretName: sonarr-tls

