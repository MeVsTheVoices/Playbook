- hosts: localhost
  gather_facts: false
  connection: local
  vars:
    desired_tags:
      - tag:unraid
      - tag:shared
      - tag:devboxes
      - tag:media-view
      - tag:media-add
      - tag:game-servers
      - tag:gateway
      - tag:media-viewer
      - tag:google-workspace
      - tag:needs-exit
    ansible_ssh_user: "root"
    ansible_ssh_private_key_file: "ssh_keys/tailscale_id_ed25519"
    generated_ssh_key_path: "{{ playbook_dir }}/ssh_keys/tailscale_id_ed25519"
  tasks:
    - name: Fetch current Tailnet status via CLI
      command: /Applications/Tailscale.app/Contents/MacOS/Tailscale status --json
      environment:
        PATH: "/usr/local/bin:/opt/homebrew/bin:/usr/bin:/bin:{{ ansible_env.PATH }}"
      register: ts_status_raw
      changed_when: false

    - name: Parse Tailnet JSON response
      set_fact:
        tailnet_status: "{{ ts_status_raw.stdout | from_json }}"
        tailnet_peers: "{{ (ts_status_raw.stdout | from_json).Peer | default({}) }}"

    - name: Initialize nodes_by_tag structure (preserve full tag names)
      set_fact:
        nodes_by_tag: |
          {
            "unraid": [],
            "shared": [],
            "devboxes": [],
            "media-view": [],
            "media-add": [],
            "game-servers": [],
            "gateway": [],
            "media-viewer": [],
            "google-workspace": [],
            "needs-exit": []
          }

    - name: Save Tailnet status JSON to temp file
      copy:
        content: "{{ ts_status_raw.stdout }}"
        dest: "/tmp/tailscale_status.json"
        mode: '0600'

    - name: Save Python helper script
      copy:
        dest: "/tmp/tailscale_node_by_tag.py"
        mode: '0700'
        content: |
          #!/usr/bin/env python3
          import json
          import re

          desired_tags = {{ desired_tags | to_json }}

          def normalize_tag(tag):
              """Remove 'tag:' prefix if present"""
              if isinstance(tag, str) and tag.startswith('tag:'):
                  return tag.split(':', 1)[1]
              return tag

          def is_mullvad_node(hostname):
              """Filter out Mullvad VPN exit nodes (pattern: cc-ccc-wg-###)"""
              return bool(re.match(r'^[a-z]{2}-[a-z]{3}-wg-\d+$', hostname))

          # Build list of desired tag names (normalized)
          target_tags = {}
          for item in desired_tags:
              if isinstance(item, str):
                  normalized = normalize_tag(item)
                  # Map both 'tag:NAME' and 'NAME' to the normalized form
                  target_tags[item] = normalized
                  target_tags[normalized] = normalized

          # Load Tailscale peers
          data = json.load(open('/tmp/tailscale_status.json'))
          peers = data.get('Peer', {}) or {}

          # Initialize result dict with all desired tag groups (even empty ones)
          result = {normalize_tag(t): [] for t in desired_tags}

          # Process each peer
          for p in peers.values():
              hostname = p.get('HostName')
              if not hostname:
                  continue

              # Skip Mullvad exit nodes
              if is_mullvad_node(hostname):
                  continue

              peer_tags = p.get('Tags') or []

              # Get FQDN (DNSName) for ansible_host
              fqdn = p.get('DNSName')
              if not fqdn:
                  continue

              # Get IP (prefer IPv4) - keep for reference
              ips = p.get('TailscaleIPs') or p.get('IPs') or []
              ip = None
              for x in ips:
                  if x and ':' not in x:  # prefer IPv4
                      ip = x
                      break
              if not ip and ips:
                  ip = ips[0]

              # Check each peer's tags against desired tags
              for peer_tag in peer_tags:
                  normalized_peer_tag = normalize_tag(peer_tag)
                  # Find matching desired tag
                  for desired in desired_tags:
                      if normalize_tag(desired) == normalized_peer_tag:
                          entry = {'hostname': hostname, 'fqdn': fqdn.rstrip('.'), 'ip': ip}
                          group_name = normalize_tag(desired)
                          if entry not in result[group_name]:
                              result[group_name].append(entry)
                          break

          print(json.dumps(result))

    - name: Build nodes_by_tag with Python helper
      shell: /usr/bin/env python3 /tmp/tailscale_node_by_tag.py
      register: nodes_by_tag_json
      changed_when: false

    - name: Set nodes_by_tag fact
      set_fact:
        nodes_by_tag: "{{ nodes_by_tag_json.stdout | from_json }}"

    - name: Show nodes grouped by tag
      debug:
        var: nodes_by_tag

    - name: Flatten nodes_by_tag into hosts_list
      set_fact:
        hosts_list: "{{ hosts_list | default([]) + item.value }}"
      loop: "{{ nodes_by_tag | dict2items }}"

    - name: Ensure local hosts folder exists in repository
      file:
        path: "{{ playbook_dir }}/hosts"
        state: directory
        mode: '0755'

    - name: Ensure groups are represented in a local Ansible inventory YAML file
      copy:
        dest: "{{ playbook_dir }}/hosts/tailscale_hosts.yaml"
        mode: '0644'
        content: |
          # Auto-generated Tailnet hosts as Ansible inventory
          all:
            hosts:
          {% for tag, peers in nodes_by_tag.items() %}
          {% for peer in peers %}
              {{ peer.hostname }}:
                ansible_host: "{{ peer.hostname }}"
                ansible_ssh_common_args: "-o ProxyCommand='tailscale ssh %h --ssh' -o StrictHostKeyChecking=no"
          {% endfor %}
          {% endfor %}
            vars:
              ansible_user: "{{ ansible_ssh_user }}"
              ansible_ssh_private_key_file: "{{ ansible_ssh_private_key_file }}"
            children:
          {% for tag, peers in nodes_by_tag.items() %}
              {{ tag }}:
                hosts:
          {% if peers|length == 0 %}
                  {}
          {% else %}
          {% for peer in peers %}
                  {{ peer.hostname }}: {}
          {% endfor %}
          {% endif %}
          {% endfor %}

    - name: (Optional) Save flat hosts list to local YAML file
      copy:
        dest: "{{ playbook_dir }}/hosts/tailscale_hosts_flat.yaml"
        mode: '0644'
        content: |
          # Auto-generated flat Tailnet hosts list
          hosts_list:
          {% for host in hosts_list %}
          - ip: {{ host.ip }}
            hostname: {{ host.hostname }}
          {% endfor %}
      when: hosts_list is defined and hosts_list | length > 0


