---
# Keep real secrets in vault-backed variables.
rack_node_tailscale_manage: true
rack_node_tailscale_oauth_enabled: true
rack_node_tailscale_tailnet: tail00c2ce
rack_node_tailscale_oauth_client_id: "{{ vault_rpi4_tailscale_oauth_client_id | default(vault_rpi5_tailscale_oauth_client_id) }}"
rack_node_tailscale_oauth_client_secret: "{{ vault_rpi4_tailscale_oauth_client_secret | default(vault_rpi5_tailscale_oauth_client_secret) }}"

rack_node_tailscale_advertise_exit_node: false
rack_node_tailscale_advertise_routes: []
rack_node_tailscale_tags:
  - tag:rpi4
  - tag:homelab
