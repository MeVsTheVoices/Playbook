---
# Keep real secrets in vault-backed variables.
raspberry_pi4_tailscale_manage: true
raspberry_pi4_tailscale_oauth_enabled: true
raspberry_pi4_tailscale_tailnet: tail00c2ce
raspberry_pi4_tailscale_oauth_client_id: "{{ vault_rpi4_tailscale_oauth_client_id | default(vault_rpi5_tailscale_oauth_client_id) }}"
raspberry_pi4_tailscale_oauth_client_secret: "{{ vault_rpi4_tailscale_oauth_client_secret | default(vault_rpi5_tailscale_oauth_client_secret) }}"

raspberry_pi4_tailscale_advertise_exit_node: false
raspberry_pi4_tailscale_advertise_routes: []
raspberry_pi4_tailscale_tags:
  - tag:rpi4
  - tag:homelab
