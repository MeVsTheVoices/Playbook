---
- name: Configure the Network Toolkit appliance
  tags:
    - network-toolkit
  when: rack_manage_with_ansible | bool
  block:
    - name: Resolve toolkit inputs
      ansible.builtin.set_fact:
        toolkit_terminal_password_hash: "{{ (provision_inputs | default({})).toolkit_terminal_password_hash | default(toolkit_terminal_password_hash) }}"
        toolkit_enable_funnel: "{{ (provision_inputs | default({})).toolkit_enable_funnel | default(toolkit_enable_funnel) | bool }}"
      no_log: true

    - name: Require a Pi 3B+ class and a valid browser credential
      ansible.builtin.assert:
        that:
          - ansible_architecture == 'aarch64'
          - ansible_distribution == 'Debian'
          - ansible_distribution_major_version | int >= 13
          - toolkit_terminal_password_hash is match('^\$6\$(rounds=[1-9][0-9]{3,8}\$)?[./A-Za-z0-9]{1,16}\$[./A-Za-z0-9]{86}$')
        fail_msg: "Use Pi OS Lite 64-bit and a SHA-512 crypt hash generated with openssl passwd -6 -stdin."
    - name: Install the networking and serial toolkit
      ansible.builtin.apt:
        name: "{{ toolkit_packages }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
        lock_timeout: 300

    - name: Install toolkit runtime helpers
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/bin/{{ item | basename }}"
        owner: root
        group: root
        mode: '0755'
      with_fileglob:
        - "{{ role_path }}/files/*"

    - name: Install pinned ARM64 browser terminal
      ansible.builtin.get_url:
        url: "{{ toolkit_ttyd_url }}"
        checksum: "sha256:{{ toolkit_ttyd_sha256 }}"
        dest: /usr/local/bin/ttyd
        owner: root
        group: root
        mode: '0755'

    - name: Repair confirmed Pi OS boot warnings
      ansible.builtin.command: /usr/local/bin/rack-toolkit-boot-fixes
      changed_when: true
      when: not ansible_check_mode

    - name: Create persistent journal configuration directory
      ansible.builtin.file:
        path: /etc/systemd/journald.conf.d
        state: directory
        owner: root
        group: root
        mode: '0755'

    - name: Install toolkit configuration
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        owner: root
        group: "{{ item.group | default('root') }}"
        mode: "{{ item.mode | default('0644') }}"
      no_log: true
      loop:
        - {src: journald.conf.j2, dest: /etc/systemd/journald.conf.d/60-rack-toolkit.conf}
        - {src: nginx.conf.j2, dest: /etc/nginx/sites-enabled/network-toolkit}
        - {src: htpasswd.j2, dest: /etc/nginx/network-toolkit.htpasswd, group: www-data, mode: '0640'}
        - {src: terminal.service.j2, dest: /etc/systemd/system/rack-toolkit-terminal.service}
        - {src: funnel.service.j2, dest: /etc/systemd/system/rack-toolkit-funnel.service}
        - {src: firewall.service.j2, dest: /etc/systemd/system/rack-toolkit-firewall.service}
        - {src: firewall.nft.j2, dest: /etc/rack-toolkit.nft}
        - {src: device.nmconnection.j2, dest: /etc/NetworkManager/system-connections/rack-device.nmconnection, mode: '0600'}
        - {src: sudoers.j2, dest: /etc/sudoers.d/network-toolkit, mode: '0440'}
        - {src: sshd.conf.j2, dest: /etc/ssh/sshd_config.d/00-network-toolkit.conf}

    - name: Activate restricted terminal and private SSH
      ansible.builtin.command: /usr/local/bin/rack-toolkit-activate
      changed_when: true
      when: not ansible_check_mode

    - name: Set public Funnel state
      ansible.builtin.systemd_service:
        name: rack-toolkit-funnel.service
        enabled: "{{ toolkit_enable_funnel | bool }}"
        state: "{{ 'restarted' if toolkit_enable_funnel | bool else 'stopped' }}"
        daemon_reload: true
      when: not ansible_check_mode
