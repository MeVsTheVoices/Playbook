---
- name: Validate the node board
  ansible.builtin.assert:
    that:
      - rack_node_board | default('') in ['pi5', 'pi4', 'pi3bplus', 'x64']
    fail_msg: "rack_node_board must be pi5, pi4, pi3bplus or x64 (set it where the rack_node role is applied)."
    quiet: true
  tags:
    - always

- name: Load the board settings
  ansible.builtin.include_vars:
    file: "{{ rack_node_board }}.yml"
  tags:
    - always

- name: Skip host when it is marked unmanaged
  ansible.builtin.meta: end_host
  when: not (rack_manage_with_ansible | bool)

# A Pi has no RTC (and a fresh mini-PC may have a stale one), so shortly after boot HTTPS downloads fail with "certificate is not yet valid" and apt rejects fresh repositories.
- name: Wait for the system clock to synchronise
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: rack_node_clock_sync
  until: (rack_node_clock_sync.rc != 0) or (rack_node_clock_sync.stdout | trim == 'yes')
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false
  when: rack_manage_with_ansible | bool
  tags:
    - baseline
    - tailscale
    - kubernetes
    - longhorn
    - docker
    - telegraf
    - monitoring
    - backup-target

# First boot runs cloud-init's own apt at the same time as the installers below.
- name: Let apt wait for the dpkg lock
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80rack-lock-timeout
    content: |
      DPkg::Lock::Timeout "300";
    owner: root
    group: root
    mode: '0644'
  when:
    - rack_manage_with_ansible | bool
    - rack_node_manage_system | bool
  tags:
    - baseline
    - tailscale
    - kubernetes
    - longhorn
    - docker
    - telegraf
    - monitoring
    - backup-target

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: rack_node_manage_system | bool
  tags:
    - baseline

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    lock_timeout: 300
  when:
    - rack_node_manage_system | bool
    - common_packages | length > 0
  tags:
    - baseline

- name: Optionally upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    lock_timeout: 300
  when: rack_node_upgrade_packages | bool
  tags:
    - baseline

- name: Apply Baseline module inputs
  ansible.builtin.include_role:
    name: node_baseline
    apply:
      tags: [baseline]
  when:
    - provision_profile | default('') == 'baseline'
    - rack_node_manage_system | bool
  tags: [baseline]

- name: Resolve Tailscale provisioning inputs
  ansible.builtin.set_fact:
    rack_node_tailscale_auth_key_provisioned: >-
      {{
        (provision_inputs.auth_key | default('') | string | trim)
        if (provision_inputs | default({})) is mapping
        else ''
      }}
    rack_node_tailscale_tailnet_effective: >-
      {{
        (provision_inputs.tailnet | default('') | string | trim)
        if (provision_inputs | default({})) is mapping
           and (provision_inputs.tailnet | default('') | string | trim) | length > 0
        else rack_node_tailscale_tailnet
      }}
    rack_node_tailscale_tags_effective: >-
      {{
        ((provision_inputs.advertise_tags | default('') | string).split(',') | map('trim') | select('truthy') | list)
        if (provision_inputs | default({})) is mapping
           and (provision_inputs.advertise_tags | default('') | string | trim) | length > 0
        else rack_node_tailscale_tags
      }}
    rack_node_tailscale_hostname_effective: "{{ provision_inputs.hostname | default(rack_node_tailscale_hostname, true) }}"
    rack_node_tailscale_ssh_effective: "{{ provision_inputs.enable_ssh | default(rack_node_tailscale_enable_ssh) | bool }}"
    rack_node_tailscale_exit_effective: "{{ provision_inputs.advertise_exit_node | default(rack_node_tailscale_advertise_exit_node) | bool }}"
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Download Tailscale installation script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install_tailscale.sh
    mode: '0755'
  register: rack_node_tailscale_installer_download
  retries: 5
  delay: 15
  until: rack_node_tailscale_installer_download is succeeded
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Run Tailscale installer when binary is missing
  ansible.builtin.command: /tmp/install_tailscale.sh
  args:
    creates: /usr/sbin/tailscaled
  register: rack_node_tailscale_install
  retries: 3
  delay: 20
  until: rack_node_tailscale_install.rc == 0
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Check for tailscaled binary
  ansible.builtin.stat:
    path: /usr/sbin/tailscaled
  register: rack_node_tailscaled_binary
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
  when:
    - rack_node_tailscale_manage | bool
    - (rack_node_tailscaled_binary.stat.exists | bool) or (not ansible_check_mode)
  tags:
    - tailscale

- name: Read tailscale status
  ansible.builtin.command: tailscale status --json
  register: rack_node_tailscale_status
  failed_when: false
  changed_when: false
  check_mode: false
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Determine whether tailscale up is needed
  ansible.builtin.set_fact:
    rack_node_tailscale_needs_up: >-
      {{
        (rack_node_tailscale_status.rc | default(1)) != 0
        or (
          (rack_node_tailscale_status.stdout | default('{}') | from_json).BackendState | default('')
        ) != 'Running'
      }}
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Request OAuth access token for Tailscale API
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/oauth/token
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ rack_node_tailscale_oauth_client_id }}"
      client_secret: "{{ rack_node_tailscale_oauth_client_secret }}"
    status_code: 200
  register: rack_node_tailscale_oauth_token
  no_log: true
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_needs_up | bool or rack_node_tailscale_force_reconfigure | bool
    - rack_node_tailscale_oauth_enabled | bool
    - rack_node_tailscale_auth_key_provisioned | default('') | length == 0
    - rack_node_tailscale_auth_key | length == 0
    - not ansible_check_mode | bool
  tags:
    - tailscale

- name: Create short-lived auth key from OAuth token
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/{{ rack_node_tailscale_tailnet_effective }}/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ rack_node_tailscale_oauth_token.json.access_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: "{{ rack_node_tailscale_tags_effective }}"
      expirySeconds: "{{ rack_node_tailscale_auth_key_ttl_seconds }}"
      description: "ansible-{{ inventory_hostname }}"
    status_code: 200
  register: rack_node_tailscale_key_response
  no_log: true
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_needs_up | bool or rack_node_tailscale_force_reconfigure | bool
    - rack_node_tailscale_oauth_enabled | bool
    - rack_node_tailscale_auth_key_provisioned | default('') | length == 0
    - rack_node_tailscale_auth_key | length == 0
    - not ansible_check_mode | bool
  tags:
    - tailscale

- name: Resolve effective auth key
  ansible.builtin.set_fact:
    rack_node_tailscale_auth_key_effective: >-
      {{
        rack_node_tailscale_auth_key_provisioned
        if (rack_node_tailscale_auth_key_provisioned | default('') | length > 0)
        else (
          rack_node_tailscale_auth_key
          if (rack_node_tailscale_auth_key | length > 0)
          else (rack_node_tailscale_key_response.json.key | default(''))
        )
      }}
  no_log: true
  when: rack_node_tailscale_manage | bool
  tags:
    - tailscale

- name: Ensure auth key exists for tailscale up
  ansible.builtin.fail:
    msg: >-
      Provide rack_node_tailscale_auth_key (or the Tailscale profile auth_key input) or enable OAuth with
      rack_node_tailscale_oauth_client_id, rack_node_tailscale_oauth_client_secret,
      and rack_node_tailscale_tailnet.
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_needs_up | bool or rack_node_tailscale_force_reconfigure | bool
    - rack_node_tailscale_auth_key_effective | default('') | length == 0
  tags:
    - tailscale

- name: Enable IPv4 forwarding for routing features
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_exit_effective | bool
      or (rack_node_tailscale_advertise_routes | length > 0)
  tags:
    - tailscale

- name: Enable IPv6 forwarding for routing features
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_exit_effective | bool
      or (rack_node_tailscale_advertise_routes | length > 0)
  tags:
    - tailscale

- name: Bring node online with desired tailscale flags
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ rack_node_tailscale_auth_key_effective }}
    --hostname={{ rack_node_tailscale_hostname_effective }}
    {{ '--accept-dns=true' if rack_node_tailscale_accept_dns else '--accept-dns=false' }}
    {{ '--ssh' if rack_node_tailscale_ssh_effective else '' }}
    {{ '--advertise-exit-node' if rack_node_tailscale_exit_effective else '' }}
    {{ '--advertise-routes=' + (rack_node_tailscale_advertise_routes | join(','))
       if (rack_node_tailscale_advertise_routes | length > 0) else '' }}
    {{ '--advertise-tags=' + (rack_node_tailscale_tags_effective | join(','))
       if (rack_node_tailscale_tags_effective | length > 0) else '' }}
  register: rack_node_tailscale_up
  no_log: true
  changed_when: >-
    {{
      rack_node_tailscale_force_reconfigure | bool
      or rack_node_tailscale_needs_up | default(true)
    }}
  when:
    - rack_node_tailscale_manage | bool
    - rack_node_tailscale_force_reconfigure | bool or rack_node_tailscale_needs_up | default(true)
  tags:
    - tailscale

- name: Apply explicit Tailscale inputs on connected nodes
  ansible.builtin.command:
    argv: >-
      {{ ['tailscale', 'set']
         + (['--hostname=' ~ (provision_inputs.hostname | trim)] if provision_inputs.hostname | default('') | trim else [])
         + (['--ssh=' ~ (rack_node_tailscale_ssh_effective | ternary('true', 'false'))] if 'enable_ssh' in (provision_inputs | default({})) else [])
         + (['--advertise-exit-node=' ~ (rack_node_tailscale_exit_effective | ternary('true', 'false'))] if 'advertise_exit_node' in (provision_inputs | default({})) else [])
         + (['--advertise-tags=' ~ (rack_node_tailscale_tags_effective | join(','))] if provision_inputs.advertise_tags | default('') | trim else []) }}
  changed_when: true
  when:
    - provision_profile | default('') == 'tailscale'
    - rack_node_tailscale_manage | bool
    - not (rack_node_tailscale_needs_up | default(true) | bool)
    - not (rack_node_tailscale_force_reconfigure | bool)
    - not ansible_check_mode
    - provision_inputs.hostname | default('') | trim or 'enable_ssh' in (provision_inputs | default({})) or 'advertise_exit_node' in (provision_inputs | default({})) or provision_inputs.advertise_tags | default('') | trim
  tags:
    - tailscale

- name: Report explicit Tailscale inputs in check mode
  ansible.builtin.debug:
    msg: "Explicit Tailscale preferences will be applied; current values are not compared."
  changed_when: true
  when:
    - provision_profile | default('') == 'tailscale'
    - rack_node_tailscale_manage | bool
    - not (rack_node_tailscale_needs_up | default(true) | bool)
    - not (rack_node_tailscale_force_reconfigure | bool)
    - ansible_check_mode
    - provision_inputs.hostname | default('') | trim or 'enable_ssh' in (provision_inputs | default({})) or 'advertise_exit_node' in (provision_inputs | default({})) or provision_inputs.advertise_tags | default('') | trim
  tags:
    - tailscale

- name: Detect K3s server unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: rack_node_k3s_server_unit
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Detect K3s agent unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: rack_node_k3s_agent_unit
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Read this node's Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: rack_node_tailscale_ip
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Resolve structured K3s settings
  ansible.builtin.set_fact:
    rack_node_k3s_role: "{{ provision_inputs.node_role | default(rack_node_worker_role) | string | lower | trim }}"
    rack_node_k3s_endpoint: "{{ provision_inputs.server_endpoint | default('') | string | trim }}"
    rack_node_k3s_token: "{{ provision_inputs.server_token | default('') | string | trim }}"
    rack_node_k3s_node_ip: >-
      {{ (provision_inputs.node_ip | default('') | string | trim)
         or (rack_node_tailscale_ip.stdout_lines | default([]) | first | default('') | trim) }}
    rack_node_k3s_security_enabled: "{{ provision_inputs.k3s_security_baseline | default(false) | bool }}"
    rack_node_k3s_config_override: "{{ provision_inputs.k3s_config | default('') | string | trim }}"
    rack_node_k3s_ingress: "{{ provision_inputs.k3s_ingress | default('traefik') | string | lower | trim }}"
    rack_node_lw_servicelb: "{{ (provision_inputs.k3s_disable_servicelb | default(rack_node_k3s_disable_default) | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_lw_metrics: "{{ (provision_inputs.k3s_disable_metrics_server | default(rack_node_k3s_disable_default) | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_lw_storage: "{{ (provision_inputs.k3s_disable_local_storage | default(rack_node_k3s_disable_default) | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_lw_netpol: "{{ (provision_inputs.k3s_disable_network_policy | default(rack_node_k3s_disable_default) | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_lw_cloud: "{{ (provision_inputs.k3s_disable_cloud_controller | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_lw_helm: "{{ (provision_inputs.k3s_disable_helm_controller | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_taint: "{{ (provision_inputs.k3s_taint | default(rack_node_k3s_taint_default) | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_max_pods: "{{ provision_inputs.k3s_max_pods | default(rack_node_k3s_max_pods_default) | string | trim or rack_node_k3s_max_pods_default }}"
    rack_node_k3s_allow_sd_etcd: "{{ (provision_inputs.k3s_allow_sd_etcd | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    rack_node_k3s_tls_san: >-
      {{ (provision_inputs.k3s_tls_san | default('') | join(',') if provision_inputs.k3s_tls_san | default('') is not string
          else provision_inputs.k3s_tls_san | default('')).split(',') | map('trim') | select('truthy') | list }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - (provision_inputs | default({})) is mapping
  no_log: true
  tags:
    - kubernetes

# K3s keeps etcd snapshots on the server's own disk; an S3 endpoint also copies them off the cluster.
- name: Resolve etcd snapshot settings
  ansible.builtin.set_fact:
    rack_node_k3s_etcd_snapshot: >-
      {{
        ({'etcd-snapshot-schedule-cron': provision_inputs.etcd_snapshot_schedule | string | trim}
          if (provision_inputs.etcd_snapshot_schedule | default('') | string | trim) | length > 0 else {})
        | combine({'etcd-snapshot-retention': provision_inputs.etcd_snapshot_retention | int}
          if (provision_inputs.etcd_snapshot_retention | default('') | string | trim) | length > 0 else {})
        | combine({
            'etcd-s3': true,
            'etcd-s3-endpoint': provision_inputs.etcd_s3_endpoint | string | trim,
            'etcd-s3-bucket': provision_inputs.etcd_s3_bucket | default('') | string | trim,
          }
          | combine({'etcd-s3-folder': provision_inputs.etcd_s3_folder | string | trim}
            if (provision_inputs.etcd_s3_folder | default('') | string | trim) | length > 0 else {})
          | combine({'etcd-s3-region': provision_inputs.etcd_s3_region | string | trim}
            if (provision_inputs.etcd_s3_region | default('') | string | trim) | length > 0 else {})
          | combine({'etcd-s3-insecure': true}
            if (provision_inputs.etcd_s3_insecure | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] else {})
          | combine({'etcd-s3-access-key': provision_inputs.etcd_s3_access_key | string | trim,
                     'etcd-s3-secret-key': provision_inputs.etcd_s3_secret_key | default('') | string | trim}
            if (provision_inputs.etcd_s3_access_key | default('') | string | trim) | length > 0 else {})
          if (provision_inputs.etcd_s3_endpoint | default('') | string | trim) | length > 0 else {})
      }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - (provision_inputs | default({})) is mapping
  no_log: true
  tags:
    - kubernetes

- name: Validate etcd snapshot settings
  ansible.builtin.assert:
    that:
      - (rack_node_k3s_etcd_snapshot['etcd-snapshot-retention'] | default(1) | int) > 0
      - not (rack_node_k3s_etcd_snapshot['etcd-s3'] | default(false)) or (rack_node_k3s_etcd_snapshot['etcd-s3-bucket'] | length > 0)
    fail_msg: "Snapshots to keep must be a whole number above 0, and an S3 endpoint needs a bucket."
    quiet: true
  when:
    - rack_node_k3s_etcd_snapshot is defined
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Validate {{ rack_node_board_label }} role
  ansible.builtin.assert:
    that:
      - rack_node_k3s_role in [rack_node_worker_role, 'utility', 'control-plane']
    fail_msg: "A {{ rack_node_board_label }} role must be {{ rack_node_worker_role }}, utility or control-plane{{ rack_node_role_fail_hint }}."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Refuse implicit K3s agent-to-server conversion
  ansible.builtin.fail:
    msg: >-
      This {{ rack_node_board_label }} has an installed k3s-agent unit. Converting it to a control-plane server requires an explicit migration or re-image.
  when:
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
    - rack_node_k3s_agent_unit.stat.exists | default(false) | bool
    - not (rack_node_k3s_server_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Refuse implicit K3s server-to-worker conversion
  ansible.builtin.fail:
    msg: >-
      This {{ rack_node_board_label }} has an installed k3s server unit. Converting it to a {{ rack_node_worker_noun }} removes its local control-plane data;
      re-image it as a {{ rack_node_worker_noun }} or explicitly migrate/uninstall the server (and remove it from etcd) before applying this module.
  when:
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == rack_node_worker_role
    - rack_node_k3s_server_unit.stat.exists | default(false) | bool
  tags:
    - kubernetes

- name: Resolve lightweight K3s component list
  ansible.builtin.set_fact:
    rack_node_k3s_disable: >-
      {{ (['servicelb'] if rack_node_lw_servicelb | bool else [])
         + (['metrics-server'] if rack_node_lw_metrics | bool else [])
         + (['local-storage'] if rack_node_lw_storage | bool else [])
         + (['traefik'] if rack_node_k3s_ingress == 'none' else []) }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Validate lightweight K3s options
  ansible.builtin.assert:
    that:
      - rack_node_k3s_ingress in ['traefik', 'none']
      - not (rack_node_lw_helm | bool) or rack_node_k3s_ingress == 'none'
    fail_msg: "Unsupported {{ rack_node_k3s_options_label }} options: ingress must be 'traefik' or 'none' (ingress-nginx is retired and not offered), and the Helm controller can only be disabled when ingress is 'none' because Traefik is installed through it."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Validate {{ rack_node_board_label }} control-plane settings
  ansible.builtin.assert:
    that:
      - rack_node_k3s_endpoint | length > 0
      - rack_node_k3s_token | length > 0
      - rack_node_k3s_node_ip | length > 0
    fail_msg: "A {{ rack_node_board_label }} control-plane node needs the K3s endpoint and server token, and must be on Tailscale (its Tailscale IP is read automatically unless node_ip is set)."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Find the device behind /var/lib
  ansible.builtin.command: findmnt --noheadings --output SOURCE --target /var/lib
  register: rack_node_k3s_data_device
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Refuse etcd on an SD card
  ansible.builtin.assert:
    that:
      - (rack_node_k3s_data_device.stdout | default('') | trim) is not match('^/dev/mmcblk') or (rack_node_k3s_allow_sd_etcd | bool)
    fail_msg: "This control-plane node keeps /var/lib on an SD card. K3s says SD cards cannot handle etcd's write load, and an unhealthy voter can break quorum. Boot it from an SSD, or tick 'Allow etcd on an SD card' to override."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Validate {{ rack_node_board_label }} {{ rack_node_worker_role }} settings
  ansible.builtin.assert:
    that:
      - rack_node_k3s_endpoint | length > 0
      - rack_node_k3s_token | length > 0
      - rack_node_k3s_node_ip | length > 0
    fail_msg: "A {{ rack_node_board_label }} {{ rack_node_worker_noun }} needs the K3s endpoint and server token, and must be on Tailscale (its Tailscale IP is read automatically unless node_ip is set)."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == rack_node_worker_role
  # Not no_log: the failure message must reach the operator. The conditions only
  # report pass/fail, never the token value.
  tags:
    - kubernetes

- name: Validate {{ rack_node_board_label }} max pods
  ansible.builtin.assert:
    that:
      - >-
        (rack_node_max_pods | length == 0)
        or (rack_node_max_pods is match('^[0-9]+$')
            and (rack_node_max_pods | int) >= 1
            and (rack_node_max_pods | int) <= 110)
    fail_msg: "Max pods must be a whole number from 1 to 110{{ '' if rack_node_k3s_max_pods_default | length > 0 else ', or blank for the K3s default' }}."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') in [rack_node_worker_role, 'control-plane']
  tags:
    - kubernetes

- name: Ensure the K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') in [rack_node_worker_role, 'control-plane']
  tags:
    - kubernetes

- name: Remove legacy secrets-encryption flag when cluster encryption is disabled
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s.service
    regexp: '.*--secrets-encryption.*'
    state: absent
  register: rack_node_encryption_flag_removed
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
    - not (rack_node_k3s_security_enabled | bool)
    - rack_node_k3s_server_unit.stat.exists | bool
  tags:
    - kubernetes

- name: Reload systemd after K3s unit flag change
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - rack_node_encryption_flag_removed is defined
    - rack_node_encryption_flag_removed.changed
  tags:
    - kubernetes

- name: Set kernel values required by K3s protected defaults
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: vm.overcommit_memory, value: '1' }
    - { name: kernel.panic, value: '10' }
    - { name: kernel.panic_on_oops, value: '1' }
  register: rack_node_k3s_kernel_defaults
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Write structured K3s control-plane config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
    content: >-
      {{
        rack_node_k3s_config_override
        if rack_node_k3s_config_override | length > 0
        else ({
          'node-name': inventory_hostname,
          'server': rack_node_k3s_endpoint,
          'token': rack_node_k3s_token,
          'node-ip': rack_node_k3s_node_ip,
          'advertise-address': rack_node_k3s_node_ip,
          'secrets-encryption': (rack_node_k3s_security_enabled | bool),
          'node-label': ['role=control-plane']
        }
        | combine({'flannel-iface': 'tailscale0'} if (rack_node_k3s_node_ip | string).startswith('100.') else {})
        | combine({'node-taint': ['node-role.kubernetes.io/control-plane:NoSchedule']} if rack_node_taint | bool else {})
        | combine({'kubelet-arg': ['max-pods=' ~ (rack_node_max_pods | int)]} if rack_node_max_pods | length > 0 else {})
        | combine({'disable': rack_node_k3s_disable} if rack_node_k3s_disable | length > 0 else {})
        | combine({'disable-network-policy': true} if rack_node_lw_netpol | bool else {})
        | combine({'disable-cloud-controller': true} if rack_node_lw_cloud | bool else {})
        | combine({'disable-helm-controller': true} if rack_node_lw_helm | bool else {})
        | combine({'tls-san': rack_node_k3s_tls_san} if rack_node_k3s_tls_san | default([]) | length > 0 else {})
        | combine(rack_node_k3s_etcd_snapshot | default({}))
        | to_nice_yaml(sort_keys=false))
      }}
  register: rack_node_k3s_server_config
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Restart K3s server when structured config changes
  ansible.builtin.service:
    name: k3s
    state: restarted
  when:
    - rack_node_k3s_role | default('') == 'control-plane'
    - rack_node_k3s_server_config is defined
    - rack_node_k3s_server_unit.stat.exists | default(false) | bool
    - >-
      rack_node_k3s_server_config.changed
      or (rack_node_k3s_kernel_defaults.changed | default(false))
      or (rack_node_encryption_flag_removed.changed | default(false))
  tags:
    - kubernetes

# Boards that always cap pods (the 3B+) keep kubelet-arg right after node-label, so existing config files stay byte-identical.
- name: Write structured K3s {{ rack_node_worker_role }} config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
    content: >-
      {{
        rack_node_k3s_config_override
        if rack_node_k3s_config_override | length > 0
        else ({
          'node-name': inventory_hostname,
          'server': rack_node_k3s_endpoint,
          'token': rack_node_k3s_token,
          'node-ip': rack_node_k3s_node_ip,
          'node-label': ['role=' ~ rack_node_worker_role]
        }
        | combine({'kubelet-arg': ['max-pods=' ~ (rack_node_max_pods | int)]} if rack_node_k3s_max_pods_default | length > 0 else {})
        | combine({'flannel-iface': 'tailscale0'} if (rack_node_k3s_node_ip | string).startswith('100.') else {})
        | combine({'node-taint': [rack_node_worker_taint]} if rack_node_taint | bool else {})
        | combine({'kubelet-arg': ['max-pods=' ~ (rack_node_max_pods | int)]} if rack_node_max_pods | length > 0 else {})
        | to_nice_yaml(sort_keys=false))
      }}
  register: rack_node_k3s_agent_config
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == rack_node_worker_role
    - not (rack_node_k3s_server_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Restart K3s agent after structured config change
  ansible.builtin.service:
    name: k3s-agent
    state: restarted
  when:
    - rack_node_k3s_agent_unit.stat.exists | default(false) | bool
    - rack_node_k3s_agent_config.changed | default(false)
  tags:
    - kubernetes

- name: Note that the utility role applies no Kubernetes configuration
  ansible.builtin.debug:
    msg: >-
      Utility role: no K3s configuration was applied. If K3s is already installed on this node it was left as-is;
      remove it explicitly if it should no longer run.
  when:
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'utility'
  tags:
    - kubernetes

- name: Read the K3s server's version
  ansible.builtin.uri:
    url: "{{ rack_node_k3s_endpoint }}/version"
    validate_certs: false
    return_content: true
    timeout: 15
  register: rack_node_k3s_server_version
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') in [rack_node_worker_role, 'control-plane']
    - rack_node_k3s_endpoint | default('') | length > 0
    - not (rack_node_k3s_server_unit.stat.exists | default(false) | bool)
    - not (rack_node_k3s_agent_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

# The config file written above carries the server, token and node IP, so a fresh install joins the cluster on first start.
- name: Install K3s when this node does not run it yet
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://get.k3s.io | {{ ('INSTALL_K3S_VERSION=' ~ (rack_node_k3s_install_version | quote) ~ ' ') if rack_node_k3s_install_version | length > 0 else '' }}INSTALL_K3S_EXEC={{ (((rack_node_k3s_role == 'control-plane') | ternary('server', 'agent')) ~ ' --with-node-id --config /etc/rancher/k3s/config.yaml') | quote }} sh -
  args:
    executable: /bin/bash
    creates: "{{ '/etc/systemd/system/k3s.service' if rack_node_k3s_role == 'control-plane' else '/etc/systemd/system/k3s-agent.service' }}"
  vars:
    # Match the server this node joins: an agent newer than its server is unsupported.
    rack_node_k3s_install_version: >-
      {{ rack_node_k3s_version if (rack_node_k3s_version | length > 0)
         else ((rack_node_k3s_server_version.json | default({})).gitVersion | default('')) }}
  register: rack_node_k3s_install
  retries: 3
  delay: 20
  until: rack_node_k3s_install.rc == 0
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') in [rack_node_worker_role, 'control-plane']
    - not (rack_node_k3s_server_unit.stat.exists | default(false) | bool)
    - not (rack_node_k3s_agent_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Wait for the joined K3s control-plane API and datastore
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig=/etc/rancher/k3s/k3s.yaml
      - --server=https://127.0.0.1:6443
      - --request-timeout=5s
      - get
      - --raw=/readyz
  register: rack_node_k3s_readiness
  changed_when: false
  retries: 24
  delay: 5
  until:
    - rack_node_k3s_readiness.rc == 0
    - rack_node_k3s_readiness.stdout | trim == 'ok'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - rack_node_k3s_role | default('') == 'control-plane'
    - not ansible_check_mode
  tags:
    - kubernetes

- name: Resolve Docker inputs
  ansible.builtin.set_fact:
    rack_node_docker_data_root: "{{ provision_inputs.docker_data_root | default('') | string | trim }}"
    rack_node_docker_registry_mirror: "{{ provision_inputs.registry_mirror | default('') | string | trim }}"
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - (provision_inputs | default({})) is mapping
  tags:
    - docker

- name: Install Docker engine
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - rack_node_manage_system | bool
    - provision_profile | default('') == 'docker'
  tags:
    - docker

- name: Ensure the Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
  tags:
    - docker

- name: Ensure the Docker data directory exists
  ansible.builtin.file:
    path: "{{ rack_node_docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0710'
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - rack_node_docker_data_root | default('') | length > 0
  tags:
    - docker

# Existing images do not move when data-root changes; only new data lands there.
- name: Write Docker daemon settings
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ {}
         | combine({'data-root': rack_node_docker_data_root} if rack_node_docker_data_root | length > 0 else {})
         | combine({'registry-mirrors': [rack_node_docker_registry_mirror]} if rack_node_docker_registry_mirror | length > 0 else {})
         | to_nice_json }}
  register: rack_node_docker_daemon
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - (rack_node_docker_data_root | default('') | length > 0) or (rack_node_docker_registry_mirror | default('') | length > 0)
  tags:
    - docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when:
    - rack_node_supports_docker | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - not ansible_check_mode
  tags:
    - docker

- name: Restart Docker when its daemon settings change
  ansible.builtin.service:
    name: docker
    state: restarted
  when:
    - rack_node_supports_docker | bool
    - provision_profile | default('') == 'docker'
    - rack_node_docker_daemon.changed | default(false)
    - not ansible_check_mode
  tags:
    - docker

- name: Read this node's Tailscale address for the backup target
  ansible.builtin.command: tailscale ip -4
  register: rack_node_garage_tailscale_ip
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Resolve backup target inputs
  ansible.builtin.set_fact:
    rack_node_garage_data: "{{ provision_inputs.garage_data_path | default('', true) | string | trim or rack_node_garage_data_path }}"
    rack_node_garage_bucket_name: "{{ provision_inputs.garage_bucket | default('', true) | string | trim or rack_node_garage_bucket }}"
    rack_node_garage_access_key: "{{ provision_inputs.garage_access_key | default('') | string | trim }}"
    rack_node_garage_secret_key: "{{ provision_inputs.garage_secret_key | default('') | string | trim }}"
    rack_node_garage_listen: >-
      {{ provision_inputs.garage_listen_address | default('', true) | string | trim
         or (rack_node_garage_tailscale_ip.stdout_lines | default([]) | first | default('') | trim)
         or '0.0.0.0' }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
    - (provision_inputs | default({})) is mapping
  no_log: true
  tags:
    - backup-target

- name: Validate backup target inputs
  ansible.builtin.assert:
    that:
      - rack_node_supports_docker | bool
      - rack_node_garage_data is match('^/[A-Za-z0-9._/-]+$')
      - rack_node_garage_bucket_name is match('^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$')
      - rack_node_garage_access_key is match('^GK[0-9a-f]{24,32}$')
      - rack_node_garage_secret_key is match('^[0-9a-f]{64}$')
      - rack_node_garage_listen is match('^[0-9a-fA-F.:]+$')
    fail_msg: >-
      The backup target needs Docker (Pi 5, Pi 4 or x86_64), an absolute data path, a lowercase bucket name,
      an access key like GK followed by 32 hex characters (echo GK$(openssl rand -hex 16)),
      a 64-character hex secret (openssl rand -hex 32) and an IP listen address.
    quiet: true
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

# Garage refuses to start once its key has a different secret, so never silently swap the keys.
- name: Read the existing backup target keys
  ansible.builtin.slurp:
    src: /etc/garage/garage.env
  register: rack_node_garage_existing_env
  failed_when: false
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Refuse to change the backup target keys
  ansible.builtin.assert:
    that:
      - >-
        rack_node_garage_existing_env.content is not defined
        or (('GARAGE_DEFAULT_ACCESS_KEY=' ~ rack_node_garage_access_key) in (rack_node_garage_existing_env.content | b64decode)
            and ('GARAGE_DEFAULT_SECRET_KEY=' ~ rack_node_garage_secret_key) in (rack_node_garage_existing_env.content | b64decode))
    fail_msg: >-
      This backup target already has a different access key or secret, and Garage will not start with a changed secret.
      Enter the original keys, or delete /etc/garage/garage.env and {{ rack_node_garage_data }} on the node to start an empty store.
    quiet: true
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Install Docker engine for the backup target
  ansible.builtin.apt:
    name: [docker.io, openssl]
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_manage_with_ansible | bool
    - rack_node_manage_system | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Ensure the backup target directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop:
    - /etc/garage
    - "{{ rack_node_garage_data }}/meta"
    - "{{ rack_node_garage_data }}/data"
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Create the backup target RPC secret once
  ansible.builtin.shell: umask 077 && openssl rand -hex 32 > /etc/garage/rpc_secret
  args:
    creates: /etc/garage/rpc_secret
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Write the backup target settings
  ansible.builtin.copy:
    dest: /etc/garage/garage.toml
    owner: root
    group: root
    mode: '0644'
    content: |
      # Managed by the rack_node role (backup-target module).
      metadata_dir = "/var/lib/garage/meta"
      data_dir = "/var/lib/garage/data"
      db_engine = "sqlite"
      replication_factor = 1
      rpc_bind_addr = "127.0.0.1:3901"
      rpc_public_addr = "127.0.0.1:3901"
      rpc_secret_file = "/etc/garage/rpc_secret"

      [s3_api]
      s3_region = "{{ rack_node_garage_region }}"
      api_bind_addr = "{{ ('[' ~ rack_node_garage_listen ~ ']') if ':' in rack_node_garage_listen else rack_node_garage_listen }}:{{ rack_node_garage_port }}"
  register: rack_node_garage_config
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Write the backup target keys
  ansible.builtin.copy:
    dest: /etc/garage/garage.env
    owner: root
    group: root
    mode: '0600'
    content: |
      GARAGE_DEFAULT_ACCESS_KEY={{ rack_node_garage_access_key }}
      GARAGE_DEFAULT_SECRET_KEY={{ rack_node_garage_secret_key }}
      GARAGE_DEFAULT_BUCKET={{ rack_node_garage_bucket_name }}
  register: rack_node_garage_env
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

# The keys reach the container from the env file, so they never appear in the unit or in ps.
- name: Write the backup target service
  ansible.builtin.copy:
    dest: /etc/systemd/system/garage.service
    owner: root
    group: root
    mode: '0644'
    content: |
      [Unit]
      Description=Garage S3 backup target
      Requires=docker.service
      After=docker.service network-online.target tailscaled.service
      Wants=network-online.target

      [Service]
      EnvironmentFile=/etc/garage/garage.env
      ExecStartPre=-/usr/bin/docker rm -f garage
      ExecStart=/usr/bin/docker run --rm --name garage --network host \
        -v /etc/garage/garage.toml:/etc/garage.toml:ro \
        -v /etc/garage/rpc_secret:/etc/garage/rpc_secret:ro \
        -v {{ rack_node_garage_data }}/meta:/var/lib/garage/meta \
        -v {{ rack_node_garage_data }}/data:/var/lib/garage/data \
        -e GARAGE_DEFAULT_ACCESS_KEY -e GARAGE_DEFAULT_SECRET_KEY -e GARAGE_DEFAULT_BUCKET \
        {{ rack_node_garage_image }} /garage server --single-node --default-bucket
      ExecStop=/usr/bin/docker stop garage
      Restart=always
      RestartSec=10

      [Install]
      WantedBy=multi-user.target
  register: rack_node_garage_unit
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
  tags:
    - backup-target

- name: Pull the backup target image
  ansible.builtin.command: docker pull {{ rack_node_garage_image }}
  register: rack_node_garage_pull
  changed_when: "'Downloaded newer image' in rack_node_garage_pull.stdout"
  retries: 3
  delay: 10
  until: rack_node_garage_pull.rc == 0
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
    - not ansible_check_mode
  tags:
    - backup-target

- name: Start the backup target
  ansible.builtin.systemd:
    name: garage
    enabled: true
    daemon_reload: true
    state: >-
      {{ 'restarted' if (rack_node_garage_config.changed or rack_node_garage_env.changed or rack_node_garage_unit.changed) else 'started' }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
    - not ansible_check_mode
  tags:
    - backup-target

- name: Wait for the backup target to answer
  ansible.builtin.wait_for:
    host: "{{ '127.0.0.1' if rack_node_garage_listen in ['0.0.0.0', '::'] else rack_node_garage_listen }}"
    port: "{{ rack_node_garage_port }}"
    timeout: 180
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'backup-target'
    - not ansible_check_mode
  tags:
    - backup-target

- name: Resolve Telegraf inputs
  ansible.builtin.set_fact:
    rack_node_telegraf_endpoint: "{{ (provision_inputs.influx_endpoint | default('') | string | trim) | regex_replace('/+$', '') }}"
    rack_node_telegraf_bucket: "{{ provision_inputs.influx_bucket | default('') | string | trim }}"
    rack_node_telegraf_org: "{{ provision_inputs.influx_org | default('') | string | trim }}"
    rack_node_telegraf_config_url: "{{ provision_inputs.telegraf_config_url | default('') | string | trim }}"
    # Influx accepts either the access key alone or "access_key:secret_key" as the token; Node Ops finds out which.
    rack_node_telegraf_token: >-
      {{ ((provision_inputs.influx_access_key | default('') | string | trim) ~ ':' ~ (provision_inputs.influx_secret_key | default('') | string | trim))
         if (provision_inputs.influx_token_mode | default('access_key') | string | trim) == 'access_key:secret_key'
         else (provision_inputs.influx_access_key | default('') | string | trim) }}
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - (provision_inputs | default({})) is mapping
  tags:
    - telegraf
    - monitoring

- name: Validate Telegraf settings
  ansible.builtin.assert:
    that:
      - (rack_node_telegraf_config_url | length > 0) or ((rack_node_telegraf_endpoint | length > 0) and (rack_node_telegraf_bucket | length > 0) and (rack_node_telegraf_org | length > 0) and (rack_node_telegraf_token | length > 0))
      - (rack_node_telegraf_endpoint | length == 0) or (rack_node_telegraf_endpoint is match('^https?://'))
      - (rack_node_telegraf_config_url | length == 0) or (rack_node_telegraf_config_url is match('^https?://'))
    fail_msg: "Telegraf needs a config URL, or an Influx endpoint (http or https), bucket, org and access key."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - (provision_inputs | default({})) is mapping
  tags:
    - telegraf
    - monitoring

- name: Install Telegraf
  ansible.builtin.apt:
    name: telegraf
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_manage_with_ansible | bool
    - rack_node_manage_system | bool
    - provision_profile | default('') == 'telegraf'
  tags:
    - telegraf
    - monitoring

- name: Ensure the Telegraf config directory exists
  ansible.builtin.file:
    path: /etc/telegraf
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
  tags:
    - telegraf
    - monitoring

# Same agent settings the first-boot script writes. The token is inside, so only root and the telegraf group read it.
- name: Write Telegraf config from the Influx settings
  ansible.builtin.copy:
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
    content: |
      [agent]
        interval = "10s"
        round_interval = true
        metric_batch_size = 1000
        metric_buffer_limit = 10000
        flush_interval = "10s"
        hostname = {{ inventory_hostname | to_json }}

      [[outputs.influxdb_v2]]
        urls = [{{ rack_node_telegraf_endpoint | to_json }}]
        token = {{ rack_node_telegraf_token | to_json }}
        organization = {{ rack_node_telegraf_org | to_json }}
        bucket = {{ rack_node_telegraf_bucket | to_json }}

      [[inputs.cpu]]
        percpu = true
        totalcpu = true

      [[inputs.mem]]

      [[inputs.disk]]
        ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

      [[inputs.diskio]]

      [[inputs.net]]

      [[inputs.system]]
  register: rack_node_telegraf_conf
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - rack_node_telegraf_config_url | length == 0
  tags:
    - telegraf
    - monitoring

- name: Download Telegraf config from the config URL
  ansible.builtin.get_url:
    url: "{{ rack_node_telegraf_config_url }}"
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
    force: true
    headers: "{{ {'Authorization': 'Token ' ~ rack_node_telegraf_token} if rack_node_telegraf_token | length > 0 else {} }}"
  register: rack_node_telegraf_download
  retries: 3
  delay: 10
  until: rack_node_telegraf_download is succeeded
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - rack_node_telegraf_config_url | length > 0
  tags:
    - telegraf
    - monitoring

# Configs generated by InfluxDB's UI read $INFLUX_TOKEN, which the packaged service takes from this file.
- name: Give Telegraf its token for downloaded configs
  ansible.builtin.lineinfile:
    path: /etc/default/telegraf
    regexp: '^INFLUX_TOKEN='
    line: "INFLUX_TOKEN={{ rack_node_telegraf_token }}"
    create: true
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
  register: rack_node_telegraf_env
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - rack_node_telegraf_config_url | length > 0
    - rack_node_telegraf_token | length > 0
  tags:
    - telegraf
    - monitoring

- name: Check that the Telegraf config parses
  ansible.builtin.command: timeout 60 telegraf --config /etc/telegraf/telegraf.conf --test --input-filter cpu
  changed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
    - (rack_node_telegraf_conf.changed | default(false)) or (rack_node_telegraf_download.changed | default(false))
  tags:
    - telegraf
    - monitoring

- name: Ensure Telegraf is enabled and running
  ansible.builtin.service:
    name: telegraf
    enabled: true
    state: started
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
  tags:
    - telegraf
    - monitoring

- name: Restart Telegraf when its config changes
  ansible.builtin.service:
    name: telegraf
    state: restarted
  when:
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
    - (rack_node_telegraf_conf.changed | default(false)) or (rack_node_telegraf_download.changed | default(false)) or (rack_node_telegraf_env.changed | default(false))
  tags:
    - telegraf
    - monitoring

- name: Resolve Longhorn inputs from provisioning payload
  ansible.builtin.set_fact:
    rack_node_longhorn_storage_path_effective: >-
      {{
        (provision_inputs.storage_path | default(rack_node_longhorn_storage_path) | string | trim)
        if (provision_inputs | default({})) is mapping
        else rack_node_longhorn_storage_path
      }}
    rack_node_longhorn_storage_disk_effective: >-
      {{
        (provision_inputs.storage_disk | default(rack_node_longhorn_storage_disk) | string | trim)
        if (provision_inputs | default({})) is mapping
        else rack_node_longhorn_storage_disk
      }}
    rack_node_longhorn_default_replica_count_effective: >-
      {{
        ((provision_inputs.default_replica_count | default(rack_node_longhorn_default_replica_count) | string | trim) | int)
        if (provision_inputs | default({})) is mapping
        else (rack_node_longhorn_default_replica_count | int)
      }}
    rack_node_longhorn_set_default_storage_class_effective: >-
      {{
        (provision_inputs.set_default_storage_class | default(rack_node_longhorn_set_default_storage_class) | string | lower)
        in ['1', 'true', 'yes', 'on']
        if (provision_inputs | default({})) is mapping
        else (rack_node_longhorn_set_default_storage_class | bool)
      }}
    rack_node_longhorn_install_chart_effective: >-
      {{
        (provision_inputs.install_chart | default(rack_node_longhorn_install_chart) | string | lower)
        in ['1', 'true', 'yes', 'on']
        if (provision_inputs | default({})) is mapping
        else (rack_node_longhorn_install_chart | bool)
      }}
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure Longhorn prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - rack_node_manage_system | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure iscsid service is enabled and running
  ansible.builtin.service:
    name: iscsid
    enabled: true
    state: started
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure open-iscsi service is enabled and running
  ansible.builtin.service:
    name: open-iscsi
    enabled: true
    state: started
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Refuse Longhorn data on the OS disk
  ansible.builtin.fail:
    msg: >-
      Longhorn stores data only on NVMe. Storage Disk is
      '{{ rack_node_longhorn_storage_disk_effective }}', which would leave
      {{ rack_node_longhorn_storage_path_effective }} on the OS disk unchecked. Use auto (on a node that boots
      from NVMe it uses the boot NVMe when no spare NVMe is fitted) or an NVMe device.
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
    - rack_node_longhorn_nvme_only | bool
    - rack_node_longhorn_storage_disk_effective | lower in ['', 'none', 'off', 'false']
  tags:
    - longhorn

- name: Prepare the Longhorn storage disk
  rack_storage_disk:
    path: "{{ rack_node_longhorn_storage_path_effective }}"
    device: "{{ rack_node_longhorn_storage_disk_effective }}"
    label: longhorn
    identify_by: "{{ rack_node_longhorn_storage_identify_by }}"
    nvme_only: "{{ rack_node_longhorn_nvme_only | bool }}"
    # A Pi 5 booting from its only NVMe keeps Longhorn in a directory on that NVMe.
    root_fallback: true
  register: rack_node_longhorn_disk
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
    - rack_node_longhorn_storage_disk_effective | lower not in ['', 'none', 'off', 'false']
  tags:
    - longhorn

- name: Report the Longhorn storage path
  ansible.builtin.debug:
    msg: >-
      Longhorn storage path {{ rack_node_longhorn_disk.path }} is on
      {{ rack_node_longhorn_disk.device_ref }}
      (UUID {{ rack_node_longhorn_disk.uuid | default('unknown until formatted') }},
      by-id {{ rack_node_longhorn_disk.by_id | default('none') }},
      {{ 'a directory on the NVMe this node boots from' if rack_node_longhorn_disk.action | default('') == 'root'
         else (rack_node_longhorn_disk.formatted | ternary('formatted now', 'already prepared')) }})
  when:
    - rack_node_supports_longhorn | bool
    - rack_node_longhorn_disk is defined
    - rack_node_longhorn_disk is not skipped
  tags:
    - longhorn

- name: Ensure Longhorn storage path exists
  ansible.builtin.file:
    path: "{{ rack_node_longhorn_storage_path_effective }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Check whether this node has joined K3s
  ansible.builtin.stat:
    path: /var/lib/rancher/k3s/agent/kubelet.kubeconfig
  register: rack_node_longhorn_kubelet_kubeconfig
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

# Longhorn runs with createDefaultDiskLabeledNodes, so only labelled nodes get a disk.
# The label goes on only after the NVMe is mounted, never onto a node whose path is still on the SD card.
- name: Label this node for a Longhorn default disk
  ansible.builtin.shell: |
    set -eu
    K="k3s kubectl --kubeconfig /var/lib/rancher/k3s/agent/kubelet.kubeconfig"
    node="$($K auth whoami -o jsonpath='{.status.userInfo.username}')"
    node="${node#system:node:}"
    current="$($K get node "$node" -o jsonpath='{.metadata.labels.node\.longhorn\.io/create-default-disk}')"
    if [ "$current" = true ]; then echo unchanged; exit 0; fi
    $K label node "$node" node.longhorn.io/create-default-disk=true --overwrite
  register: rack_node_longhorn_disk_label
  changed_when: "'unchanged' not in rack_node_longhorn_disk_label.stdout"
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
    - rack_node_longhorn_disk is defined
    - rack_node_longhorn_disk is not skipped
    - rack_node_longhorn_disk.device_ref | default(none) is not none
    - rack_node_longhorn_kubelet_kubeconfig.stat.exists | default(false)
  tags:
    - longhorn

- name: Check whether this node is a K3s server
  ansible.builtin.command: systemctl is-active k3s
  register: rack_node_k3s_server_active
  changed_when: false
  failed_when: false
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Install or update Longhorn via K3s HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/longhorn-helmchart.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: longhorn
        namespace: kube-system
      spec:
        chart: longhorn
        repo: https://charts.longhorn.io
        targetNamespace: longhorn-system
        createNamespace: true
        valuesContent: |-
          defaultSettings:
            defaultDataPath: {{ rack_node_longhorn_storage_path_effective | quote }}
            createDefaultDiskLabeledNodes: true
            defaultReplicaCount: {{ rack_node_longhorn_default_replica_count_effective | int }}
          persistence:
            defaultClassReplicaCount: {{ rack_node_longhorn_default_replica_count_effective | int }}
            defaultClass: {{ rack_node_longhorn_set_default_storage_class_effective | ternary('true', 'false') }}
  when:
    - rack_node_supports_longhorn | bool
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
    - rack_node_longhorn_install_chart_effective | bool
    - rack_node_k3s_server_active.rc == 0
  tags:
    - longhorn
