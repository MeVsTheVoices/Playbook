---
# Raspberry Pi 3B+ constants. Settings an operator may override belong in group_vars, not here.
raspberry_pi_board_label: Pi 3B+
raspberry_pi_board_tailscale_tags:
  - tag:rpi-3bplus
raspberry_pi_board_tailscale_advertise_exit_node: false
raspberry_pi_worker_role: light-worker
raspberry_pi_worker_noun: light worker
raspberry_pi_worker_taint: rack/light=true:NoSchedule
raspberry_pi_role_fail_hint: "; 'worker' and other values are not valid for this board"
raspberry_pi_k3s_options_label: lightweight K3s
raspberry_pi_k3s_disable_default: "true"
raspberry_pi_k3s_taint_default: "true"
# Always set: a blank max pods falls back to 20.
raspberry_pi_k3s_max_pods_default: "20"
# The Docker module targets Pi 4 and Pi 5 only.
raspberry_pi_supports_docker: false
raspberry_pi_supports_longhorn: false
