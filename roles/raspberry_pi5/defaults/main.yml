---
raspberry_pi5_manage_system: true
raspberry_pi5_upgrade_packages: false
raspberry_pi5_tailscale_manage: true
raspberry_pi5_tailscale_oauth_enabled: true

# Set this directly if you already have a reusable/preauth auth key.
raspberry_pi5_tailscale_auth_key: ""

# OAuth client-credential flow inputs (recommended to source from vault).
raspberry_pi5_tailscale_oauth_client_id: ""
raspberry_pi5_tailscale_oauth_client_secret: ""
raspberry_pi5_tailscale_tailnet: ""
raspberry_pi5_tailscale_auth_key_ttl_seconds: 86400

# Optional device tags. Must be allowed by your tailnet ACL policy.
raspberry_pi5_tailscale_tags:
  - tag:rpi5

# Host behavior.
raspberry_pi5_tailscale_hostname: "{{ inventory_hostname }}"
raspberry_pi5_tailscale_accept_dns: true
raspberry_pi5_tailscale_enable_ssh: false
raspberry_pi5_tailscale_advertise_exit_node: true
raspberry_pi5_tailscale_advertise_routes: []

# Force re-running tailscale up even if device is already connected.
raspberry_pi5_tailscale_force_reconfigure: false

# Longhorn defaults (used when provision_profile=longhorn).
# Keep storage_path configurable so future SD -> NVMe boot/storage moves only
# require changing this path, not the workflow.
raspberry_pi5_longhorn_storage_path: /var/lib/longhorn
raspberry_pi5_longhorn_default_replica_count: 2
raspberry_pi5_longhorn_set_default_storage_class: true
raspberry_pi5_longhorn_install_chart: true
raspberry_pi5_longhorn_chart_version: ""
