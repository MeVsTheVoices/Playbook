---
- name: Skip host when it is marked unmanaged
  ansible.builtin.meta: end_host
  when: not (rack_manage_with_ansible | bool)

# A Pi has no RTC, so shortly after boot HTTPS downloads fail with "certificate is not yet valid" and apt rejects fresh repositories.
- name: Wait for the system clock to synchronise
  ansible.builtin.command: timedatectl show --property=NTPSynchronized --value
  register: raspberry_pi5_clock_sync
  until: (raspberry_pi5_clock_sync.rc != 0) or (raspberry_pi5_clock_sync.stdout | trim == 'yes')
  retries: 60
  delay: 5
  changed_when: false
  failed_when: false
  check_mode: false
  when: rack_manage_with_ansible | bool
  tags:
    - baseline
    - tailscale
    - kubernetes
    - longhorn
    - docker
    - telegraf
    - monitoring

# First boot runs cloud-init's own apt at the same time as the installers below.
- name: Let apt wait for the dpkg lock
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/80rack-lock-timeout
    content: |
      DPkg::Lock::Timeout "300";
    owner: root
    group: root
    mode: '0644'
  when:
    - rack_manage_with_ansible | bool
    - raspberry_pi5_manage_system | bool
  tags:
    - baseline
    - tailscale
    - kubernetes
    - longhorn
    - docker
    - telegraf
    - monitoring

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when: raspberry_pi5_manage_system | bool
  tags:
    - baseline

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    lock_timeout: 300
  when:
    - raspberry_pi5_manage_system | bool
    - common_packages | length > 0
  tags:
    - baseline

- name: Optionally upgrade packages
  ansible.builtin.apt:
    upgrade: dist
    lock_timeout: 300
  when: raspberry_pi5_upgrade_packages | bool
  tags:
    - baseline

- name: Resolve Tailscale provisioning inputs
  ansible.builtin.set_fact:
    raspberry_pi5_tailscale_auth_key_provisioned: >-
      {{
        (provision_inputs.auth_key | default('') | string | trim)
        if (provision_inputs | default({})) is mapping
        else ''
      }}
    raspberry_pi5_tailscale_tailnet_effective: >-
      {{
        (provision_inputs.tailnet | default('') | string | trim)
        if (provision_inputs | default({})) is mapping
           and (provision_inputs.tailnet | default('') | string | trim) | length > 0
        else raspberry_pi5_tailscale_tailnet
      }}
    raspberry_pi5_tailscale_tags_effective: >-
      {{
        ((provision_inputs.advertise_tags | default('') | string).split(',') | map('trim') | select('truthy') | list)
        if (provision_inputs | default({})) is mapping
           and (provision_inputs.advertise_tags | default('') | string | trim) | length > 0
        else raspberry_pi5_tailscale_tags
      }}
  when:
    - rack_manage_with_ansible | bool
    - raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Download Tailscale installation script
  ansible.builtin.get_url:
    url: https://tailscale.com/install.sh
    dest: /tmp/install_tailscale.sh
    mode: '0755'
  register: raspberry_pi5_tailscale_installer_download
  retries: 5
  delay: 15
  until: raspberry_pi5_tailscale_installer_download is succeeded
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Run Tailscale installer when binary is missing
  ansible.builtin.command: /tmp/install_tailscale.sh
  args:
    creates: /usr/sbin/tailscaled
  register: raspberry_pi5_tailscale_install
  retries: 3
  delay: 20
  until: raspberry_pi5_tailscale_install.rc == 0
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Check for tailscaled binary
  ansible.builtin.stat:
    path: /usr/sbin/tailscaled
  register: raspberry_pi5_tailscaled_binary
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Ensure tailscaled service is enabled and running
  ansible.builtin.service:
    name: tailscaled
    enabled: true
    state: started
  when:
    - raspberry_pi5_tailscale_manage | bool
    - (raspberry_pi5_tailscaled_binary.stat.exists | bool) or (not ansible_check_mode)
  tags:
    - tailscale

- name: Read tailscale status
  ansible.builtin.command: tailscale status --json
  register: raspberry_pi5_tailscale_status
  failed_when: false
  changed_when: false
  check_mode: false
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Determine whether tailscale up is needed
  ansible.builtin.set_fact:
    raspberry_pi5_tailscale_needs_up: >-
      {{
        (raspberry_pi5_tailscale_status.rc | default(1)) != 0
        or (
          (raspberry_pi5_tailscale_status.stdout | default('{}') | from_json).BackendState | default('')
        ) != 'Running'
      }}
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Request OAuth access token for Tailscale API
  ansible.builtin.uri:
    url: https://api.tailscale.com/api/v2/oauth/token
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ raspberry_pi5_tailscale_oauth_client_id }}"
      client_secret: "{{ raspberry_pi5_tailscale_oauth_client_secret }}"
    status_code: 200
  register: raspberry_pi5_tailscale_oauth_token
  no_log: true
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_oauth_enabled | bool
    - raspberry_pi5_tailscale_auth_key_provisioned | default('') | length == 0
    - raspberry_pi5_tailscale_auth_key | length == 0
    - not ansible_check_mode | bool
  tags:
    - tailscale

- name: Create short-lived auth key from OAuth token
  ansible.builtin.uri:
    url: "https://api.tailscale.com/api/v2/tailnet/{{ raspberry_pi5_tailscale_tailnet_effective }}/keys"
    method: POST
    headers:
      Authorization: "Bearer {{ raspberry_pi5_tailscale_oauth_token.json.access_token }}"
    body_format: json
    body:
      capabilities:
        devices:
          create:
            reusable: false
            ephemeral: false
            preauthorized: true
            tags: "{{ raspberry_pi5_tailscale_tags_effective }}"
      expirySeconds: "{{ raspberry_pi5_tailscale_auth_key_ttl_seconds }}"
      description: "ansible-{{ inventory_hostname }}"
    status_code: 200
  register: raspberry_pi5_tailscale_key_response
  no_log: true
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_oauth_enabled | bool
    - raspberry_pi5_tailscale_auth_key_provisioned | default('') | length == 0
    - raspberry_pi5_tailscale_auth_key | length == 0
    - not ansible_check_mode | bool
  tags:
    - tailscale

- name: Resolve effective auth key
  ansible.builtin.set_fact:
    raspberry_pi5_tailscale_auth_key_effective: >-
      {{
        raspberry_pi5_tailscale_auth_key_provisioned
        if (raspberry_pi5_tailscale_auth_key_provisioned | default('') | length > 0)
        else (
          raspberry_pi5_tailscale_auth_key
          if (raspberry_pi5_tailscale_auth_key | length > 0)
          else (raspberry_pi5_tailscale_key_response.json.key | default(''))
        )
      }}
  no_log: true
  when: raspberry_pi5_tailscale_manage | bool
  tags:
    - tailscale

- name: Ensure auth key exists for tailscale up
  ansible.builtin.fail:
    msg: >-
      Provide raspberry_pi5_tailscale_auth_key (or the Tailscale profile auth_key input) or enable OAuth with
      raspberry_pi5_tailscale_oauth_client_id, raspberry_pi5_tailscale_oauth_client_secret,
      and raspberry_pi5_tailscale_tailnet.
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_auth_key_effective | default('') | length == 0
  tags:
    - tailscale

- name: Enable IPv4 forwarding for routing features
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_advertise_exit_node | bool
      or (raspberry_pi5_tailscale_advertise_routes | length > 0)
  tags:
    - tailscale

- name: Enable IPv6 forwarding for routing features
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    state: present
    sysctl_set: true
    reload: true
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_advertise_exit_node | bool
      or (raspberry_pi5_tailscale_advertise_routes | length > 0)
  tags:
    - tailscale

- name: Bring node online with desired tailscale flags
  ansible.builtin.command: >-
    tailscale up
    --auth-key={{ raspberry_pi5_tailscale_auth_key_effective }}
    --hostname={{ raspberry_pi5_tailscale_hostname }}
    {{ '--accept-dns=true' if raspberry_pi5_tailscale_accept_dns else '--accept-dns=false' }}
    {{ '--ssh' if raspberry_pi5_tailscale_enable_ssh else '' }}
    {{ '--advertise-exit-node' if raspberry_pi5_tailscale_advertise_exit_node else '' }}
    {{ '--advertise-routes=' + (raspberry_pi5_tailscale_advertise_routes | join(','))
       if (raspberry_pi5_tailscale_advertise_routes | length > 0) else '' }}
    {{ '--advertise-tags=' + (raspberry_pi5_tailscale_tags_effective | join(','))
       if (raspberry_pi5_tailscale_tags_effective | length > 0) else '' }}
  register: raspberry_pi5_tailscale_up
  no_log: true
  changed_when: >-
    {{
      raspberry_pi5_tailscale_force_reconfigure | bool
      or raspberry_pi5_tailscale_needs_up | default(true)
    }}
  when:
    - raspberry_pi5_tailscale_manage | bool
    - raspberry_pi5_tailscale_force_reconfigure | bool or raspberry_pi5_tailscale_needs_up | default(true)
  tags:
    - tailscale

- name: Detect K3s server unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s.service
  register: raspberry_pi5_k3s_server_unit
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Detect K3s agent unit
  ansible.builtin.stat:
    path: /etc/systemd/system/k3s-agent.service
  register: raspberry_pi5_k3s_agent_unit
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Read this node's Tailscale IPv4
  ansible.builtin.command: tailscale ip -4
  register: raspberry_pi5_tailscale_ip
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
  tags:
    - kubernetes

- name: Resolve structured K3s settings
  ansible.builtin.set_fact:
    raspberry_pi5_k3s_role: "{{ provision_inputs.node_role | default('worker') | string | lower | trim }}"
    raspberry_pi5_k3s_endpoint: "{{ provision_inputs.server_endpoint | default('') | string | trim }}"
    raspberry_pi5_k3s_token: "{{ provision_inputs.server_token | default('') | string | trim }}"
    raspberry_pi5_k3s_node_ip: >-
      {{ (provision_inputs.node_ip | default('') | string | trim)
         or (raspberry_pi5_tailscale_ip.stdout_lines | default([]) | first | default('') | trim) }}
    raspberry_pi5_k3s_security_enabled: "{{ provision_inputs.k3s_security_baseline | default(false) | bool }}"
    raspberry_pi5_k3s_config_override: "{{ provision_inputs.k3s_config | default('') | string | trim }}"
    raspberry_pi5_k3s_ingress: "{{ provision_inputs.k3s_ingress | default('traefik') | string | lower | trim }}"
    raspberry_pi5_lw_servicelb: "{{ (provision_inputs.k3s_disable_servicelb | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_lw_metrics: "{{ (provision_inputs.k3s_disable_metrics_server | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_lw_storage: "{{ (provision_inputs.k3s_disable_local_storage | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_lw_netpol: "{{ (provision_inputs.k3s_disable_network_policy | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_lw_cloud: "{{ (provision_inputs.k3s_disable_cloud_controller | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_lw_helm: "{{ (provision_inputs.k3s_disable_helm_controller | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_taint: "{{ (provision_inputs.k3s_taint | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
    raspberry_pi5_max_pods: "{{ provision_inputs.k3s_max_pods | default('') | string | trim }}"
    raspberry_pi5_k3s_allow_sd_etcd: "{{ (provision_inputs.k3s_allow_sd_etcd | default('false') | string | lower | trim) in ['true', '1', 'yes', 'on'] }}"
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - (provision_inputs | default({})) is mapping
  no_log: true
  tags:
    - kubernetes

- name: Validate Pi 5 role
  ansible.builtin.assert:
    that:
      - raspberry_pi5_k3s_role in ['worker', 'utility', 'control-plane']
    fail_msg: "A Pi 5 role must be worker, utility or control-plane."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Refuse implicit K3s agent-to-server conversion
  ansible.builtin.fail:
    msg: >-
      This Pi 5 has an installed k3s-agent unit. Converting it to a control-plane server requires an explicit migration or re-image.
  when:
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
    - raspberry_pi5_k3s_agent_unit.stat.exists | default(false) | bool
    - not (raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Refuse implicit K3s server-to-worker conversion
  ansible.builtin.fail:
    msg: >-
      This Pi 5 has an installed k3s server unit. Converting it to a worker removes its local control-plane data;
      re-image it as a worker or explicitly migrate/uninstall the server (and remove it from etcd) before applying this module.
  when:
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'worker'
    - raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool
  tags:
    - kubernetes

- name: Resolve lightweight K3s component list
  ansible.builtin.set_fact:
    raspberry_pi5_k3s_disable: >-
      {{ (['servicelb'] if raspberry_pi5_lw_servicelb | bool else [])
         + (['metrics-server'] if raspberry_pi5_lw_metrics | bool else [])
         + (['local-storage'] if raspberry_pi5_lw_storage | bool else [])
         + (['traefik'] if raspberry_pi5_k3s_ingress == 'none' else []) }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Validate lightweight K3s options
  ansible.builtin.assert:
    that:
      - raspberry_pi5_k3s_ingress in ['traefik', 'none']
      - not (raspberry_pi5_lw_helm | bool) or raspberry_pi5_k3s_ingress == 'none'
    fail_msg: "Unsupported K3s server options: ingress must be 'traefik' or 'none' (ingress-nginx is retired and not offered), and the Helm controller can only be disabled when ingress is 'none' because Traefik is installed through it."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
    - (provision_inputs | default({})) is mapping
  tags:
    - kubernetes

- name: Validate Pi 5 control-plane settings
  ansible.builtin.assert:
    that:
      - raspberry_pi5_k3s_endpoint | length > 0
      - raspberry_pi5_k3s_token | length > 0
      - raspberry_pi5_k3s_node_ip | length > 0
    fail_msg: "A Pi 5 control-plane node needs the K3s endpoint and server token, and must be on Tailscale (its Tailscale IP is read automatically unless node_ip is set)."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Find the device behind /var/lib
  ansible.builtin.command: findmnt --noheadings --output SOURCE --target /var/lib
  register: raspberry_pi5_k3s_data_device
  changed_when: false
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Refuse etcd on an SD card
  ansible.builtin.assert:
    that:
      - (raspberry_pi5_k3s_data_device.stdout | default('') | trim) is not match('^/dev/mmcblk') or (raspberry_pi5_k3s_allow_sd_etcd | bool)
    fail_msg: "This control-plane node keeps /var/lib on an SD card. K3s says SD cards cannot handle etcd's write load, and an unhealthy voter can break quorum. Boot it from an SSD, or tick 'Allow etcd on an SD card' to override."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Validate Pi 5 worker settings
  ansible.builtin.assert:
    that:
      - raspberry_pi5_k3s_endpoint | length > 0
      - raspberry_pi5_k3s_token | length > 0
      - raspberry_pi5_k3s_node_ip | length > 0
    fail_msg: "A Pi 5 worker needs the K3s endpoint and server token, and must be on Tailscale (its Tailscale IP is read automatically unless node_ip is set)."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'worker'
  # Not no_log: the failure message must reach the operator. The conditions only
  # report pass/fail, never the token value.
  tags:
    - kubernetes

- name: Validate Pi 5 max pods
  ansible.builtin.assert:
    that:
      - >-
        (raspberry_pi5_max_pods | length == 0)
        or (raspberry_pi5_max_pods is match('^[0-9]+$')
            and (raspberry_pi5_max_pods | int) >= 1
            and (raspberry_pi5_max_pods | int) <= 110)
    fail_msg: "Max pods must be a whole number from 1 to 110, or blank for the K3s default."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') in ['worker', 'control-plane']
  tags:
    - kubernetes

- name: Ensure the K3s config directory exists
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') in ['worker', 'control-plane']
  tags:
    - kubernetes

- name: Remove legacy secrets-encryption flag when cluster encryption is disabled
  ansible.builtin.lineinfile:
    path: /etc/systemd/system/k3s.service
    regexp: '.*--secrets-encryption.*'
    state: absent
  register: raspberry_pi5_encryption_flag_removed
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
    - not (raspberry_pi5_k3s_security_enabled | bool)
    - raspberry_pi5_k3s_server_unit.stat.exists | bool
  tags:
    - kubernetes

- name: Reload systemd after K3s unit flag change
  ansible.builtin.systemd:
    daemon_reload: true
  when:
    - raspberry_pi5_encryption_flag_removed is defined
    - raspberry_pi5_encryption_flag_removed.changed
  tags:
    - kubernetes

- name: Set kernel values required by K3s protected defaults
  ansible.posix.sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    state: present
    sysctl_set: true
    reload: true
  loop:
    - { name: vm.overcommit_memory, value: '1' }
    - { name: kernel.panic, value: '10' }
    - { name: kernel.panic_on_oops, value: '1' }
  register: raspberry_pi5_k3s_kernel_defaults
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Write structured K3s control-plane config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
    content: >-
      {{
        raspberry_pi5_k3s_config_override
        if raspberry_pi5_k3s_config_override | length > 0
        else ({
          'node-name': inventory_hostname,
          'server': raspberry_pi5_k3s_endpoint,
          'token': raspberry_pi5_k3s_token,
          'node-ip': raspberry_pi5_k3s_node_ip,
          'advertise-address': raspberry_pi5_k3s_node_ip,
          'secrets-encryption': (raspberry_pi5_k3s_security_enabled | bool),
          'node-label': ['role=control-plane']
        }
        | combine({'node-taint': ['node-role.kubernetes.io/control-plane:NoSchedule']} if raspberry_pi5_taint | bool else {})
        | combine({'kubelet-arg': ['max-pods=' ~ (raspberry_pi5_max_pods | int)]} if raspberry_pi5_max_pods | length > 0 else {})
        | combine({'disable': raspberry_pi5_k3s_disable} if raspberry_pi5_k3s_disable | length > 0 else {})
        | combine({'disable-network-policy': true} if raspberry_pi5_lw_netpol | bool else {})
        | combine({'disable-cloud-controller': true} if raspberry_pi5_lw_cloud | bool else {})
        | combine({'disable-helm-controller': true} if raspberry_pi5_lw_helm | bool else {})
        | to_nice_yaml(sort_keys=false))
      }}
  register: raspberry_pi5_k3s_server_config
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
  tags:
    - kubernetes

- name: Restart K3s server when structured config changes
  ansible.builtin.service:
    name: k3s
    state: restarted
  when:
    - raspberry_pi5_k3s_role | default('') == 'control-plane'
    - raspberry_pi5_k3s_server_config is defined
    - raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool
    - >-
      raspberry_pi5_k3s_server_config.changed
      or (raspberry_pi5_k3s_kernel_defaults.changed | default(false))
      or (raspberry_pi5_encryption_flag_removed.changed | default(false))
  tags:
    - kubernetes

- name: Write structured K3s worker config
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: '0600'
    content: >-
      {{
        raspberry_pi5_k3s_config_override
        if raspberry_pi5_k3s_config_override | length > 0
        else ({
          'node-name': inventory_hostname,
          'server': raspberry_pi5_k3s_endpoint,
          'token': raspberry_pi5_k3s_token,
          'node-ip': raspberry_pi5_k3s_node_ip,
          'node-label': ['role=worker']
        }
        | combine({'node-taint': ['rack/dedicated=true:NoSchedule']} if raspberry_pi5_taint | bool else {})
        | combine({'kubelet-arg': ['max-pods=' ~ (raspberry_pi5_max_pods | int)]} if raspberry_pi5_max_pods | length > 0 else {})
        | to_nice_yaml(sort_keys=false))
      }}
  register: raspberry_pi5_k3s_structured_config
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'worker'
    - not (raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Restart K3s agent after structured config change
  ansible.builtin.service:
    name: k3s-agent
    state: restarted
  when:
    - raspberry_pi5_k3s_agent_unit.stat.exists | default(false) | bool
    - raspberry_pi5_k3s_structured_config.changed | default(false)
  tags:
    - kubernetes

- name: Note that the utility role applies no Kubernetes configuration
  ansible.builtin.debug:
    msg: >-
      Utility role: no K3s configuration was applied. If K3s is already installed on this node it was left as-is;
      remove it explicitly if it should no longer run.
  when:
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') == 'utility'
  tags:
    - kubernetes

- name: Read the K3s server's version
  ansible.builtin.uri:
    url: "{{ raspberry_pi5_k3s_endpoint }}/version"
    validate_certs: false
    return_content: true
    timeout: 15
  register: raspberry_pi5_k3s_server_version
  failed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') in ['worker', 'control-plane']
    - raspberry_pi5_k3s_endpoint | default('') | length > 0
    - not (raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool)
    - not (raspberry_pi5_k3s_agent_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

# The config file written above carries the server, token and node IP, so a fresh install joins the cluster on first start.
- name: Install K3s when this node does not run it yet
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://get.k3s.io | {{ ('INSTALL_K3S_VERSION=' ~ (raspberry_pi5_k3s_install_version | quote) ~ ' ') if raspberry_pi5_k3s_install_version | length > 0 else '' }}INSTALL_K3S_EXEC={{ (((raspberry_pi5_k3s_role == 'control-plane') | ternary('server', 'agent')) ~ ' --with-node-id --config /etc/rancher/k3s/config.yaml') | quote }} sh -
  args:
    executable: /bin/bash
    creates: "{{ '/etc/systemd/system/k3s.service' if raspberry_pi5_k3s_role == 'control-plane' else '/etc/systemd/system/k3s-agent.service' }}"
  vars:
    # Match the server this node joins: an agent newer than its server is unsupported.
    raspberry_pi5_k3s_install_version: >-
      {{ raspberry_pi5_k3s_version if (raspberry_pi5_k3s_version | length > 0)
         else ((raspberry_pi5_k3s_server_version.json | default({})).gitVersion | default('')) }}
  register: raspberry_pi5_k3s_install
  retries: 3
  delay: 20
  until: raspberry_pi5_k3s_install.rc == 0
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'kubernetes'
    - raspberry_pi5_k3s_role | default('') in ['worker', 'control-plane']
    - not (raspberry_pi5_k3s_server_unit.stat.exists | default(false) | bool)
    - not (raspberry_pi5_k3s_agent_unit.stat.exists | default(false) | bool)
  tags:
    - kubernetes

- name: Resolve Docker inputs
  ansible.builtin.set_fact:
    raspberry_pi5_docker_data_root: "{{ provision_inputs.docker_data_root | default('') | string | trim }}"
    raspberry_pi5_docker_registry_mirror: "{{ provision_inputs.registry_mirror | default('') | string | trim }}"
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - (provision_inputs | default({})) is mapping
  tags:
    - docker

- name: Install Docker engine
  ansible.builtin.apt:
    name: docker.io
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_manage_with_ansible | bool
    - raspberry_pi5_manage_system | bool
    - provision_profile | default('') == 'docker'
  tags:
    - docker

- name: Ensure the Docker config directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
  tags:
    - docker

- name: Ensure the Docker data directory exists
  ansible.builtin.file:
    path: "{{ raspberry_pi5_docker_data_root }}"
    state: directory
    owner: root
    group: root
    mode: '0710'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - raspberry_pi5_docker_data_root | default('') | length > 0
  tags:
    - docker

# Existing images do not move when data-root changes; only new data lands there.
- name: Write Docker daemon settings
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    content: |
      {{ {}
         | combine({'data-root': raspberry_pi5_docker_data_root} if raspberry_pi5_docker_data_root | length > 0 else {})
         | combine({'registry-mirrors': [raspberry_pi5_docker_registry_mirror]} if raspberry_pi5_docker_registry_mirror | length > 0 else {})
         | to_nice_json }}
  register: raspberry_pi5_docker_daemon
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - (raspberry_pi5_docker_data_root | default('') | length > 0) or (raspberry_pi5_docker_registry_mirror | default('') | length > 0)
  tags:
    - docker

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'docker'
    - not ansible_check_mode
  tags:
    - docker

- name: Restart Docker when its daemon settings change
  ansible.builtin.service:
    name: docker
    state: restarted
  when:
    - provision_profile | default('') == 'docker'
    - raspberry_pi5_docker_daemon.changed | default(false)
    - not ansible_check_mode
  tags:
    - docker

- name: Resolve Telegraf inputs
  ansible.builtin.set_fact:
    raspberry_pi5_telegraf_endpoint: "{{ (provision_inputs.influx_endpoint | default('') | string | trim) | regex_replace('/+$', '') }}"
    raspberry_pi5_telegraf_bucket: "{{ provision_inputs.influx_bucket | default('') | string | trim }}"
    raspberry_pi5_telegraf_org: "{{ provision_inputs.influx_org | default('') | string | trim }}"
    raspberry_pi5_telegraf_config_url: "{{ provision_inputs.telegraf_config_url | default('') | string | trim }}"
    # Influx accepts either the access key alone or "access_key:secret_key" as the token; Node Ops finds out which.
    raspberry_pi5_telegraf_token: >-
      {{ ((provision_inputs.influx_access_key | default('') | string | trim) ~ ':' ~ (provision_inputs.influx_secret_key | default('') | string | trim))
         if (provision_inputs.influx_token_mode | default('access_key') | string | trim) == 'access_key:secret_key'
         else (provision_inputs.influx_access_key | default('') | string | trim) }}
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - (provision_inputs | default({})) is mapping
  tags:
    - telegraf
    - monitoring

- name: Validate Telegraf settings
  ansible.builtin.assert:
    that:
      - (raspberry_pi5_telegraf_config_url | length > 0) or ((raspberry_pi5_telegraf_endpoint | length > 0) and (raspberry_pi5_telegraf_bucket | length > 0) and (raspberry_pi5_telegraf_org | length > 0) and (raspberry_pi5_telegraf_token | length > 0))
      - (raspberry_pi5_telegraf_endpoint | length == 0) or (raspberry_pi5_telegraf_endpoint is match('^https?://'))
      - (raspberry_pi5_telegraf_config_url | length == 0) or (raspberry_pi5_telegraf_config_url is match('^https?://'))
    fail_msg: "Telegraf needs a config URL, or an Influx endpoint (http or https), bucket, org and access key."
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - (provision_inputs | default({})) is mapping
  tags:
    - telegraf
    - monitoring

- name: Install Telegraf
  ansible.builtin.apt:
    name: telegraf
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_manage_with_ansible | bool
    - raspberry_pi5_manage_system | bool
    - provision_profile | default('') == 'telegraf'
  tags:
    - telegraf
    - monitoring

- name: Ensure the Telegraf config directory exists
  ansible.builtin.file:
    path: /etc/telegraf
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
  tags:
    - telegraf
    - monitoring

# Same agent settings the first-boot script writes. The token is inside, so only root and the telegraf group read it.
- name: Write Telegraf config from the Influx settings
  ansible.builtin.copy:
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
    content: |
      [agent]
        interval = "10s"
        round_interval = true
        metric_batch_size = 1000
        metric_buffer_limit = 10000
        flush_interval = "10s"
        hostname = {{ inventory_hostname | to_json }}

      [[outputs.influxdb_v2]]
        urls = [{{ raspberry_pi5_telegraf_endpoint | to_json }}]
        token = {{ raspberry_pi5_telegraf_token | to_json }}
        organization = {{ raspberry_pi5_telegraf_org | to_json }}
        bucket = {{ raspberry_pi5_telegraf_bucket | to_json }}

      [[inputs.cpu]]
        percpu = true
        totalcpu = true

      [[inputs.mem]]

      [[inputs.disk]]
        ignore_fs = ["tmpfs", "devtmpfs", "overlay", "squashfs"]

      [[inputs.diskio]]

      [[inputs.net]]

      [[inputs.system]]
  register: raspberry_pi5_telegraf_conf
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - raspberry_pi5_telegraf_config_url | length == 0
  tags:
    - telegraf
    - monitoring

- name: Download Telegraf config from the config URL
  ansible.builtin.get_url:
    url: "{{ raspberry_pi5_telegraf_config_url }}"
    dest: /etc/telegraf/telegraf.conf
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
    force: true
    headers: "{{ {'Authorization': 'Token ' ~ raspberry_pi5_telegraf_token} if raspberry_pi5_telegraf_token | length > 0 else {} }}"
  register: raspberry_pi5_telegraf_download
  retries: 3
  delay: 10
  until: raspberry_pi5_telegraf_download is succeeded
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - raspberry_pi5_telegraf_config_url | length > 0
  tags:
    - telegraf
    - monitoring

# Configs generated by InfluxDB's UI read $INFLUX_TOKEN, which the packaged service takes from this file.
- name: Give Telegraf its token for downloaded configs
  ansible.builtin.lineinfile:
    path: /etc/default/telegraf
    regexp: '^INFLUX_TOKEN='
    line: "INFLUX_TOKEN={{ raspberry_pi5_telegraf_token }}"
    create: true
    owner: root
    group: "{{ 'root' if ansible_check_mode else 'telegraf' }}"
    mode: '0640'
  register: raspberry_pi5_telegraf_env
  no_log: true
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - raspberry_pi5_telegraf_config_url | length > 0
    - raspberry_pi5_telegraf_token | length > 0
  tags:
    - telegraf
    - monitoring

- name: Check that the Telegraf config parses
  ansible.builtin.command: timeout 60 telegraf --config /etc/telegraf/telegraf.conf --test --input-filter cpu
  changed_when: false
  check_mode: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
    - (raspberry_pi5_telegraf_conf.changed | default(false)) or (raspberry_pi5_telegraf_download.changed | default(false))
  tags:
    - telegraf
    - monitoring

- name: Ensure Telegraf is enabled and running
  ansible.builtin.service:
    name: telegraf
    enabled: true
    state: started
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
  tags:
    - telegraf
    - monitoring

- name: Restart Telegraf when its config changes
  ansible.builtin.service:
    name: telegraf
    state: restarted
  when:
    - provision_profile | default('') == 'telegraf'
    - not ansible_check_mode
    - (raspberry_pi5_telegraf_conf.changed | default(false)) or (raspberry_pi5_telegraf_download.changed | default(false)) or (raspberry_pi5_telegraf_env.changed | default(false))
  tags:
    - telegraf
    - monitoring

- name: Resolve Longhorn inputs from provisioning payload
  ansible.builtin.set_fact:
    raspberry_pi5_longhorn_storage_path_effective: >-
      {{
        (provision_inputs.storage_path | default(raspberry_pi5_longhorn_storage_path) | string | trim)
        if (provision_inputs | default({})) is mapping
        else raspberry_pi5_longhorn_storage_path
      }}
    raspberry_pi5_longhorn_default_replica_count_effective: >-
      {{
        ((provision_inputs.default_replica_count | default(raspberry_pi5_longhorn_default_replica_count) | string | trim) | int)
        if (provision_inputs | default({})) is mapping
        else (raspberry_pi5_longhorn_default_replica_count | int)
      }}
    raspberry_pi5_longhorn_set_default_storage_class_effective: >-
      {{
        (provision_inputs.set_default_storage_class | default(raspberry_pi5_longhorn_set_default_storage_class) | string | lower)
        in ['1', 'true', 'yes', 'on']
        if (provision_inputs | default({})) is mapping
        else (raspberry_pi5_longhorn_set_default_storage_class | bool)
      }}
    raspberry_pi5_longhorn_install_chart_effective: >-
      {{
        (provision_inputs.install_chart | default(raspberry_pi5_longhorn_install_chart) | string | lower)
        in ['1', 'true', 'yes', 'on']
        if (provision_inputs | default({})) is mapping
        else (raspberry_pi5_longhorn_install_chart | bool)
      }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure Longhorn prerequisite packages are installed
  ansible.builtin.apt:
    name:
      - open-iscsi
      - nfs-common
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300
  when:
    - rack_manage_with_ansible | bool
    - raspberry_pi5_manage_system | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure iscsid service is enabled and running
  ansible.builtin.service:
    name: iscsid
    enabled: true
    state: started
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure open-iscsi service is enabled and running
  ansible.builtin.service:
    name: open-iscsi
    enabled: true
    state: started
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Ensure Longhorn storage path exists
  ansible.builtin.file:
    path: "{{ raspberry_pi5_longhorn_storage_path_effective }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Check whether this node is a K3s server
  ansible.builtin.command: systemctl is-active k3s
  register: raspberry_pi5_k3s_server_active
  changed_when: false
  failed_when: false
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
  tags:
    - longhorn

- name: Install or update Longhorn via K3s HelmChart manifest
  ansible.builtin.copy:
    dest: /var/lib/rancher/k3s/server/manifests/longhorn-helmchart.yaml
    owner: root
    group: root
    mode: '0644'
    content: |
      apiVersion: helm.cattle.io/v1
      kind: HelmChart
      metadata:
        name: longhorn
        namespace: kube-system
      spec:
        chart: longhorn
        repo: https://charts.longhorn.io
        targetNamespace: longhorn-system
        createNamespace: true
        valuesContent: |-
          defaultSettings:
            defaultDataPath: {{ raspberry_pi5_longhorn_storage_path_effective | quote }}
            defaultReplicaCount: {{ raspberry_pi5_longhorn_default_replica_count_effective | int }}
          persistence:
            defaultClassReplicaCount: {{ raspberry_pi5_longhorn_default_replica_count_effective | int }}
            defaultClass: {{ raspberry_pi5_longhorn_set_default_storage_class_effective | ternary('true', 'false') }}
  when:
    - rack_manage_with_ansible | bool
    - provision_profile | default('') == 'longhorn'
    - raspberry_pi5_longhorn_install_chart_effective | bool
    - raspberry_pi5_k3s_server_active.rc == 0
  tags:
    - longhorn
