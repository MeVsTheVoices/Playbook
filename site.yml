---
- name: Configure active Raspberry Pi 5 hosts
  hosts: rpi5_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: raspberry_pi5

- name: Configure active Raspberry Pi B+ hosts
  hosts: rpi_bplus_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: raspberry_pi_bplus
