---
- name: Run explicit Node Ops host maintenance modules
  hosts: rpi5_active:rpi4_active:rpi_3bplus_active:network_toolkit_active:playbook_server_active
  become: true
  roles:
    - role: node_maintenance
      when: (provision_profile | default('')) in ['cgroups', 'systemd']

- name: Configure active Raspberry Pi 5 hosts
  hosts: rpi5_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: raspberry_pi5

- name: Configure active Raspberry Pi 4 hosts
  hosts: rpi4_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: raspberry_pi4

- name: Configure active Raspberry Pi 3B+ hosts
  hosts: rpi_3bplus_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: raspberry_pi_3bplus

- name: Configure Network Toolkit Pi 3B+ appliances
  hosts: network_toolkit_active
  become: true
  roles:
    - role: raspberry_pi_3bplus
    - role: network_toolkit

- name: Configure self-hosted Playbook servers
  hosts: playbook_server_active
  become: true
  roles:
    - role: playbook_server
