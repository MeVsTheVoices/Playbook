---
- name: Manage packages on any Linux node
  hosts: all
  gather_facts: false
  become: true
  roles:
    - role: node_maintenance
      when: (provision_profile | default('')) == 'package-manager'
      tags: [package-manager]

- name: Configure active Raspberry Pi 5 hosts
  hosts: rpi5_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: rack_node
      vars:
        rack_node_board: pi5

- name: Configure active Raspberry Pi 4 hosts
  hosts: rpi4_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: rack_node
      vars:
        rack_node_board: pi4

- name: Configure active Raspberry Pi 3B+ hosts
  hosts: rpi_3bplus_active
  become: true
  become_method: sudo
  become_user: root
  roles:
    - role: rack_node
      vars:
        rack_node_board: pi3bplus

- name: Configure Network Toolkit Pi 3B+ appliances
  hosts: network_toolkit_active
  become: true
  roles:
    - role: rack_node
      vars:
        rack_node_board: pi3bplus
    - role: network_toolkit

- name: Configure self-hosted Playbook servers
  hosts: playbook_server_active
  become: true
  roles:
    - role: playbook_server

- name: Configure generic x86_64 Linux nodes
  hosts: linux_x64_active
  become: true
  roles:
    - role: generic_linux_x64
    # Tailscale, K3s, Docker and Telegraf modules, shared with the Pis.
    - role: rack_node
      vars:
        rack_node_board: x64
