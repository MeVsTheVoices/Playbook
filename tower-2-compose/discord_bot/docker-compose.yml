services:
  red-bot:
    image: ghcr.io/rhomelab/red-discordbot:latest
    restart: always
    mem_limit: 1g
    environment:
      INSTANCE_NAME: tower-2-redbot
      PREFIX: ^
      TOKEN: ${TOWER2_DISCORD_BOT_TOKEN:?Set TOWER2_DISCORD_BOT_TOKEN}
      PIP_REQUIREMENTS: matplotlib pandas psutil
    volumes:
    - /mnt/user/appdata/redbot:/redbot/data
    dns:
    - 8.8.8.8
    - 1.1.1.1
