services:
  lancache:
    image: lancachenet/monolithic:latest
    container_name: Lancache
    restart: "no"
    network_mode: br0
    working_dir: /scripts
    mem_limit: 2147483648
    pids_limit: 2048
    shm_size: 67108864
    entrypoint:
    - /bin/bash
    - -e
    - /init/entrypoint
    command:
    - /init/supervisord
    environment:
    - TCP_PORT_80=80
    - TCP_PORT_443=443
    - CA_TS_FALLBACK_DIR=/data/logs
    - TZ=America/Los_Angeles
    - HOST_OS=Unraid
    - HOST_HOSTNAME=Tower-2
    - HOST_CONTAINERNAME=Lancache
    - PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - SUPERVISORD_EXIT_ON_FATAL=1
    - LC_ALL=en_GB.UTF-8
    - LANG=en_GB.UTF-8
    - LANGUAGE=en_GB.UTF-8
    - SUPERVISORD_LOGLEVEL=WARN
    - GENERICCACHE_VERSION=2
    - CACHE_MODE=monolithic
    - WEBUSER=www-data
    - CACHE_INDEX_SIZE=500m
    - CACHE_DISK_SIZE=1000g
    - MIN_FREE_DISK=10g
    - CACHE_MAX_AGE=3560d
    - CACHE_SLICE_SIZE=1m
    - UPSTREAM_DNS=8.8.8.8 8.8.4.4
    - BEAT_TIME=1h
    - LOGFILE_RETENTION=3560
    - CACHE_DOMAINS_REPO=https://github.com/uklans/cache-domains.git
    - CACHE_DOMAINS_BRANCH=master
    - NGINX_WORKER_PROCESSES=auto
    - NGINX_LOG_FORMAT=cachelog
    volumes:
    - /mnt/user/appdata/lancache/logs:/data/logs:rw
    - /mnt/user/lancache/:/data/cache/:rw
    labels:
      description: Single caching container for caching game content at LAN parties.
      maintainer: LanCache.Net Team <team@lancache.net>
      net.unraid.docker.icon: https://raw.githubusercontent.com/redvex2460/docker-templates/master/redvex2460/images/lancache.png
      net.unraid.docker.managed: dockerman
      org.opencontainers.image.ref.name: ubuntu
      org.opencontainers.image.version: '24.04'
      version: '3'
