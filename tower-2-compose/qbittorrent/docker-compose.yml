services:
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent
    container_name: qbittorrent
    restart: "no"
    network_mode: media_ingress
    working_dir: /
    cpu_shares: 256
    cpuset: 2,3
    mem_limit: 2147483648
    pids_limit: 2048
    shm_size: 67108864
    entrypoint:
    - /opt/unraid/tailscale
    environment:
    - HOST_OS=Unraid
    - HOST_HOSTNAME=Tower-2
    - HOST_CONTAINERNAME=qbittorrent
    - PUID=99
    - PGID=100
    - TAILSCALE_ALLOW_LAN_ACCESS=true
    - TAILSCALE_HOSTNAME=tower-2-qbittorrent
    - TAILSCALE_USE_SSH=false
    - TAILSCALE_USERSPACE_NETWORKING=false
    - ORG_ENTRYPOINT=/init
    - TZ=America/Los_Angeles
    - TORRENTING_PORT=6881
    - UMASK=022
    - TAILSCALE_EXIT_NODE_IP=100.119.10.123
    - TAILSCALE_SERVE_PORT=8432
    - WEBUI_PORT=8432
    - PATH=/lsiopy/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    - 'PS1=$(whoami)@$(hostname):$(pwd)\$ '
    - HOME=/config
    - TERM=xterm
    - S6_CMD_WAIT_FOR_SERVICES_MAXTIME=0
    - S6_VERBOSITY=1
    - S6_STAGE2_HOOK=/docker-mods
    - VIRTUAL_ENV=/lsiopy
    - LSIO_FIRST_PARTY=true
    - XDG_CONFIG_HOME=/config
    - XDG_DATA_HOME=/config
    volumes:
    - /mnt/user/appdata/qbittorrent:/config:rw
    - /usr/local/share/docker/tailscale_container_hook:/opt/unraid/tailscale
    - /mnt/user/servarr/:/data:rw
    ports:
    - 6881:6881/tcp
    - 6881:6881/udp
    - 8432:8080/tcp
    cap_add:
    - NET_ADMIN
    devices:
    - /dev/net/tun:/dev/net/tun:rwm
    labels:
      build_version: Linuxserver.io version:- 5.1.4-r2-ls448 Build-date:- 2026-04-05T07:46:56+00:00
      maintainer: thespad
      net.unraid.docker.icon: https://raw.githubusercontent.com/linuxserver/docker-templates/master/linuxserver.io/img/qbittorrent-logo.png
      net.unraid.docker.managed: dockerman
      net.unraid.docker.tailscale.hostname: tower-2-qbittorrent
      net.unraid.docker.tailscale.webui: https://[hostname][magicdns]
      net.unraid.docker.webui: http://192.168.8.224:8123
      org.opencontainers.image.authors: linuxserver.io
      org.opencontainers.image.created: '2026-04-05T07:46:56+00:00'
      org.opencontainers.image.description: "The [Qbittorrent](https://www.qbittorrent.org/)\
        \ project aims to provide an open-source software alternative to -\xA6Torrent.\
        \ qBittorrent is based on the Qt toolkit and libtorrent-rasterbar library."
      org.opencontainers.image.documentation: https://docs.linuxserver.io/images/docker-qbittorrent
      org.opencontainers.image.licenses: GPL-3.0-only
      org.opencontainers.image.ref.name: 46ba48206e2eedb3d01cf3e2b49c9767604ee3f6
      org.opencontainers.image.revision: 46ba48206e2eedb3d01cf3e2b49c9767604ee3f6
      org.opencontainers.image.source: https://github.com/linuxserver/docker-qbittorrent
      org.opencontainers.image.title: Qbittorrent
      org.opencontainers.image.url: https://github.com/linuxserver/docker-qbittorrent/packages
      org.opencontainers.image.vendor: linuxserver.io
      org.opencontainers.image.version: 5.1.4-r2-ls448
      tsdproxy.authkey: ${TOWER2_MEDIA_ADD_AUTHKEY:?Set TOWER2_MEDIA_ADD_AUTHKEY}
      tsdproxy.enable: 'true'
      tsdproxy.port: '8432'
      tsdproxy.tags: tag:media-add
