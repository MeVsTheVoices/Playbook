services:
  romm:
    image: rommapp/romm:latest
    container_name: romm
    restart: unless-stopped
    environment:
    - DB_HOST=romm-db
    - DB_NAME=romm
    - DB_USER=romm-user
    - DB_PASSWD=${TOWER2_ROMM_DB_PASSWORD:?Set TOWER2_ROMM_DB_PASSWORD}
    - ROMM_AUTH_SECRET_KEY=${TOWER2_ROMM_AUTH_SECRET_KEY:?Set TOWER2_ROMM_AUTH_SECRET_KEY}
    - SCREENSCRAPER_USER=mevsthevoices
    - SCREENSCRAPER_PASSWORD=${TOWER2_ROMM_SCREENSCRAPER_PASSWORD:?Set TOWER2_ROMM_SCREENSCRAPER_PASSWORD}
    - RETROACHIEVEMENTS_API_KEY=${TOWER2_ROMM_RETROACHIEVEMENTS_API_KEY:?Set TOWER2_ROMM_RETROACHIEVEMENTS_API_KEY}
    - HASHEOUS_API_ENABLED=true
    volumes:
    - /mnt/user/romms:/romm/resources
    - /mnt/user/appdata/romm/redis:/redis-data
    - /mnt/user/appdata/romm/library:/romm/library
    - /mnt/user/appdata/romm/assets:/romm/assets
    - /mnt/user/appdata/romm/config:/romm/config
    ports:
    - 8974:8080
    networks:
    - media_ingress
    labels:
      tsdproxy.enable: 'true'
      tsdproxy.name: tower-2-romm
      tsdproxy.port.1: 80/http:8080/http
      tsdproxy.dash.label: Romm
      tsdproxy.dash.icon: si/romm
      tsdproxy.tags: tag:view
    depends_on:
      romm-db:
        condition: service_healthy
  romm-db:
    image: mariadb:latest
    container_name: romm-db
    restart: unless-stopped
    environment:
    - MARIADB_ROOT_PASSWORD=${TOWER2_ROMM_DB_ROOT_PASSWORD:?Set TOWER2_ROMM_DB_ROOT_PASSWORD}
    - MARIADB_DATABASE=romm
    - MARIADB_USER=romm-user
    - MARIADB_PASSWORD=${TOWER2_ROMM_DB_PASSWORD:?Set TOWER2_ROMM_DB_PASSWORD}
    volumes:
    - /mnt/user/appdata/mariadb/mysql_data:/var/lib/mysql
    healthcheck:
      test:
      - CMD
      - healthcheck.sh
      - --connect
      - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
    - media_ingress
networks:
  media_ingress:
    external: true
