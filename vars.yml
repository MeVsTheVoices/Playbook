---
# Project Paths
ansible_dir: "{{ ansible_env.HOME }}/ansible"
venv_path: "{{ playbook_dir }}/.venv"

# OS Specific Dependencies
system_dependencies_linux:
  - python3-pip
  - python3-venv
  - git

system_dependencies_macos:
  - python3
  - git

# Python/Ansible Packages
python_packages:
  - ansible
  - ansible-lint
  - pyyaml